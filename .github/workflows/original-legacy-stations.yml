name: Preserved Windows Legacy Station Reference
on:
  push:
    branches: ['codex/production-**']
    paths: ['Tests/Production/LegacyStations/**', 'Tests/Production/StockVessels/Driver.cpp', 'Tests/Production/StockVessels/Observation.h', 'Tests/Production/StockVessels/original.py', 'Tests/Production/ApplicationObservation.h', '.github/workflows/original-legacy-stations.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-legacy-stations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_legacy_stations:
    name: Original legacy stations ${{ matrix.configuration }} ${{ matrix.math_profile }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/cache@v6
        with:
          path: out/cockpit-cache
          key: original-cockpit-control-runtime-${{ matrix.configuration }}-${{ hashFiles('Tests/Production/Cockpit/Reference/provenance.json') }}
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - name: Stage unchanged application, client, SDK, data and software OpenGL
        shell: pwsh
        run: |
          python -B Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/stage_mesa.py stage --cache out/mesa-cache --destination out/mesa-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/CockpitControls/prepare.py --configuration ${{ matrix.configuration }} --cache out/cockpit-cache --output out/legacy-station-original-runtime
          exit $LASTEXITCODE
      - name: Build only the public SDK observation module
        shell: pwsh
        run: |
          cmake -S Tests/Production/LegacyStations -B out/legacy-station-driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DORBITER_TEST_RUNTIME="$pwd/out/legacy-station-original-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/legacy-station-driver --parallel 2
          exit $LASTEXITCODE
      - name: Select original SSE2 CRT when required
        if: matrix.math_profile == 'sse2'
        shell: pwsh
        run: '"ORBITER_TEST_OBSERVER_SSE2=1" >> $env:GITHUB_ENV'
      - name: Observe all vessels and docking ports in four unchanged legacy scenes twice
        run: >-
          python -B Tests/Production/LegacyStations/original.py
          --executable out/legacy-station-original-runtime/Orbiter.exe --data out/production-data
          --planets out/standard-planets --mesa out/mesa-runtime
          --configuration ${{ matrix.configuration }} --math-profile ${{ matrix.math_profile }}
          --output out/legacy-stations-original
      - name: Reject missing background stations and docking-port observations
        run: >-
          python -B Tests/Production/LegacyStations/Gate.Test.py
          --capture out/legacy-stations-original/legacy_stations_3-1 --case legacy_stations_3
          --output out/legacy-stations-original/gate-control.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-legacy-stations-${{ matrix.configuration }}-${{ matrix.math_profile }}
          retention-days: 90
          path: |
            out/legacy-stations-original/capture.json
            out/legacy-stations-original/gate-control.json
            out/legacy-stations-original/*/*.csv
            out/legacy-stations-original/*/*.rgba
            out/legacy-stations-original/*/*.png
            out/legacy-stations-original/*/*.json
            out/legacy-stations-original/*/*.txt
            out/legacy-stations-original/*/*.log
            out/legacy-stations-original/*/Scenarios/Behavior.scn
            out/legacy-stations-original/*/Orbiter.cfg
            out/legacy-station-original-runtime/control-reference-runtime.json
            out/legacy-station-original-runtime/test-runtime.json
            out/legacy-station-original-runtime/Modules/Plugin/ProductionCockpitDriver.dll
            out/legacy-station-driver/CMakeCache.txt
            out/legacy-station-driver/compile_commands.json
