name: Production World and Terrain Windows and Linux
on:
  push:
    branches: ['codex/production-**']
    paths: ['Src/Orbiter/**', 'Src/Celbody/**', 'Orbitersdk/**', 'Tests/Production/Elevation/**', 'Tests/Production/Planets/**', 'Tests/Production/World/**', '.github/workflows/production-elevation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reference:
    name: Verify frozen terrain evidence or prepare first capture
    runs-on: ubuntu-24.04
    outputs:
      capture: ${{ steps.state.outputs.capture }}
    steps:
      - uses: actions/checkout@v7
      - id: state
        shell: bash
        run: |
          if test -f Tests/Production/Elevation/Reference/provenance.json; then
            python3 -B Tests/Production/Elevation/frozen_reference.py
            echo 'capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
  native:
    name: Shared terrain ${{ matrix.os }} ${{ matrix.configuration }} x64
    needs: reference
    if: needs.reference.outputs.capture == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          vsversion: '17.0'
          arch: x64
      - name: Install native archive dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build original shared terrain and actual native module dependencies
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Src/Orbiter/Production -B out/terrain-native -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_BUILD_NATIVE_CELESTIAL_MODULES=ON 2>&1 | tee terrain-configure.log
          cmake --build out/terrain-native --target production_native_elevation_observer production_native_planet_observer production_native_world_observer --parallel 2 2>&1 | tee terrain-build.log
      - uses: actions/cache@v6
        with:
          path: out/data-cache/production-stock-data-v1.zip
          key: production-native-data-${{ hashFiles('Tests/Production/input-storage.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Verify original celestial data from audited immutable storage
        run: >-
          python Tests/Production/prepare_native_data.py --archive out/data-cache/production-stock-data-v1.zip
          --destination out/data --group celestial
      - name: Verify original planetary archives
        run: >-
          python Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json
          --archive out/planet-cache/Orbiter2016.zip --destination out/planets
      - name: Compare repeated production terrain queries with frozen original Windows
        run: >-
          python Tests/Production/Elevation/verify_port.py
          --executable out/terrain-native/production_native_elevation_observer${{ runner.os == 'Windows' && '.exe' || '' }}
          --modules out/terrain-native/NativeModules --data out/data --planets out/planets
          --output out/terrain-observation --configuration ${{ matrix.configuration }}
      - name: Compare actual Sol world against frozen Windows and repeated finalized steps
        run: >-
          python Tests/Production/World/verify.py
          --executable out/terrain-native/production_native_world_observer${{ runner.os == 'Windows' && '.exe' || '' }}
          --modules out/terrain-native/NativeModules --data out/data --planets out/planets
          --output out/world-observation --configuration ${{ matrix.configuration }}
      - name: Exercise actual stock planet/base CPU geometry and repeated lifetime
        run: >-
          python Tests/Production/Planets/verify.py
          --executable out/terrain-native/production_native_planet_observer${{ runner.os == 'Windows' && '.exe' || '' }}
          --modules out/terrain-native/NativeModules --data out/data --planets out/planets
          --output out/planet-observation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-terrain-${{ matrix.os }}-${{ matrix.configuration }}-x64
          retention-days: 90
          path: |
            terrain-*.log
            out/terrain-native/CMakeCache.txt
            out/terrain-observation/*.csv
            out/terrain-observation/*.json
            out/terrain-observation/*.log
            out/planet-observation/*.log
            out/planet-observation/*.json
            out/world-observation/*.csv
            out/world-observation/*.json
            out/world-observation/*.log
  parity:
    name: Production terrain Windows/Linux parity
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-terrain-*-*-x64
          path: out/evidence
      - run: python3 -B Tests/Production/Elevation/compare_platforms.py --evidence out/evidence --report native-terrain-parity.json
      - run: python3 -B Tests/Production/World/compare_platforms.py --evidence out/evidence --report native-world-parity.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-terrain-parity
          retention-days: 90
          path: |
            native-terrain-parity.json
            native-world-parity.json
  observe:
    needs: reference
    if: needs.reference.outputs.capture == 'true'
    name: Original terrain Windows ${{ matrix.configuration }} x64
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/download-artifact@v8
        with:
          name: production-runtime-${{ matrix.configuration }}-x64
          run-id: 41286856235
          github-token: ${{ github.token }}
          path: out/runtime-package
      - name: Unpack original production application and SDK
        run: python -m zipfile -e out/runtime-package/windows-test-runtime.zip out/runtime
      - name: Compile read-only observer against that exact SDK
        shell: pwsh
        run: |
          cmake -S Tests/Production/Elevation -B out/elevation-observer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} "-DORBITER_TEST_RUNTIME:PATH=$pwd/out/runtime" 2>&1 | Tee-Object terrain-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/elevation-observer --parallel 2 2>&1 | Tee-Object terrain-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "cl 2>&1 & exit /b 0" | Out-File terrain-compiler.txt
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Verify original production and planet data
        shell: pwsh
        run: |
          python Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe real terrain height and normals through original production API
        run: >-
          python Tests/Production/Elevation/capture.py --runtime out/runtime --data out/data
          --planets out/planets --output out/elevation-observation --configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-terrain-${{ matrix.configuration }}-x64
          retention-days: 90
          path: |
            terrain-*.log
            terrain-compiler.txt
            out/elevation-observation/*.json
            out/elevation-observation/**/*.csv
            out/elevation-observation/**/Orbiter.log
            out/elevation-observation/**/console.txt
  compare:
    name: Original terrain Debug/Release comparison
    needs: observe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: original-terrain-*-x64
          path: out/evidence
      - run: >-
          python3 -B Tests/Production/Elevation/compare_windows.py
          --debug out/evidence/original-terrain-Debug-x64/out/elevation-observation
          --release out/evidence/original-terrain-Release-x64/out/elevation-observation
          --report terrain-original-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-terrain-comparison
          path: terrain-original-comparison.json
