name: Production Windows OpenGL Client

on:
  push:
    branches: ['codex/production-**']
    paths:
      - 'OVP/OGLClient/**'
      - 'Tests/Production/Client/**'
      - '.github/workflows/production-client.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Real Windows client ${{ matrix.configuration }} x64
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DXSDK_DIR: '${{ github.workspace }}\DXSDK'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - name: Verify Phase 1 is accepted and all frozen evidence remains intact
        run: |
          python Tests/Production/frozen_reference.py
          python Tests/Production/frozen_behavior.py
          python Tests/Production/observation_source.py
      - uses: actions/cache@v6
        id: dxsdk
        with:
          path: '${{ github.workspace }}\DXSDK'
          key: dxsdk_jun10
      - name: Prepare existing SDK header dependency
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl --fail -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o DXSDK_Jun10.exe
          if errorlevel 1 exit /b 1
          7z x DXSDK_Jun10.exe DXSDK/Include DXSDK/Lib
          if errorlevel 1 exit /b 1
      - uses: actions/cache@v6
        id: runtime-cache
        with:
          path: out/runtime-archive/windows-test-runtime.zip
          key: production-client-sdk-06d8989823c59e651061d409425c19ec71360bfa-${{ matrix.configuration }}-${{ env.VCToolsVersion }}
      - uses: actions/download-artifact@v8
        id: original-runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true' && matrix.configuration == 'Debug'
        continue-on-error: true
        with:
          name: production-runtime-${{ matrix.configuration }}-x64
          run-id: 41192125192
          github-token: ${{ github.token }}
          path: out/runtime-archive
      - name: Check whether the frozen-source application needs rebuilding
        id: rebuild
        shell: pwsh
        run: |
          if (Test-Path out/runtime-archive/windows-test-runtime.zip) {
            'needed=false' >> $env:GITHUB_OUTPUT
          } else {
            'needed=true' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v7
        if: steps.rebuild.outputs.needed == 'true'
        with:
          ref: 06d8989823c59e651061d409425c19ec71360bfa
          path: out/runtime-source
      - name: Rebuild and test the original application and SDK when no retained runtime exists
        if: steps.rebuild.outputs.needed == 'true'
        shell: pwsh
        run: |
          cmake -S out/runtime-source -B out/runtime-rebuild -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DORBITER_BUILD_D3D9CLIENT=ON -DORBITER_BUILD_XRSOUND=OFF -DORBITER_MAKE_DOC=OFF -DORBITER_MAKE_TESTS=ON -DORBITER_PORTABLE_REFERENCE_CAPTURE=ON -DORBITER_PRODUCTION_REFERENCE_CAPTURE=ON "-DDXSDK_DIR:PATH=$env:DXSDK_DIR" 2>&1 | Tee-Object runtime-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/runtime-rebuild --parallel 2 2>&1 | Tee-Object runtime-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/runtime-rebuild --output-on-failure 2>&1 | Tee-Object runtime-ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tests/Production/build_metadata.py --build out/runtime-rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskRoot=$pwd.Path
          Push-Location "$taskRoot/out/runtime-source"
          try {
            python "$taskRoot/Tests/Production/package_test_runtime.py" --build "$taskRoot/out/runtime-rebuild" --output "$taskRoot/out/runtime-archive/windows-test-runtime.zip"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Unpack and verify the same-build Windows application and SDK
        shell: pwsh
        run: |
          Expand-Archive out/runtime-archive/windows-test-runtime.zip out/production-app
          python Tests/Production/verify_test_runtime.py --runtime out/production-app --source 06d8989823c59e651061d409425c19ec71360bfa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the separately linked Windows GraphicsClient module
        shell: pwsh
        run: |
          cmake -S OVP/OGLClient -B out/opengl-client -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DORBITER_TEST_RUNTIME="$pwd/out/production-app" "-DDXSDK_DIR=$env:DXSDK_DIR" 2>&1 | Tee-Object client-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/opengl-client --target OGLClient --parallel 2 -- -k0 2>&1 | Tee-Object client-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the accepted production observation driver against the same SDK
        shell: pwsh
        run: |
          cmake -S Tests/Production/BehaviorBuild -B out/driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/production-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/driver --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Prepare verified real Solar System and planet resources
        run: |
          python Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          python Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - name: Stage the pinned application-local software OpenGL driver
        run: python Tests/Production/mesa_runtime.py stage --cache out/mesa-cache --destination out/mesa-runtime
      - name: Execute real Windows Orbiter with Sol, ISS and source-built ShuttlePB
        run: >-
          python Tests/Production/Client/run_client.py --orbiter out/production-app/Orbiter.exe
          --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime
          --configuration ${{ matrix.configuration }} --output out/client-execution
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-client-${{ matrix.configuration }}
          path: |
            out/client-execution/**/*.csv
            out/client-execution/**/*.json
            out/client-execution/**/*.png
            out/client-execution/**/*.rgba
            out/client-execution/**/*.txt
            out/client-execution/**/*.log
            out/client-execution/**/*.scn
            out/client-execution/**/Orbiter.cfg
            runtime-configure.log
            runtime-build.log
            runtime-ctest.log
            out/runtime-rebuild/build-inputs.json
            out/runtime-rebuild/CMakeCache.txt
            client-configure.log
            client-build.log
            out/opengl-client/CMakeCache.txt
            out/opengl-client/compile_commands.json
            out/production-app/Modules/Plugin/OGLClient.dll
            out/production-app/Modules/Plugin/OGLClient.pdb
            out/production-app/Modules/OGLClient/**

  compare:
    name: Windows client numerical, scene and image comparison
    needs: client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: real-client-*
          path: out/client-artifacts
      - name: Compare controlled states, real scene identities, camera landmarks and full images
        run: >-
          python3 -B Tests/Production/Client/compare_client.py
          --debug out/client-artifacts/real-client-Debug/out/client-execution/scene
          --release out/client-artifacts/real-client-Release/out/client-execution/scene
          --report out/client-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-client-comparison
          path: out/client-comparison.json
