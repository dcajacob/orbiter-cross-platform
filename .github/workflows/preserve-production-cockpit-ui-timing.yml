name: Preserve Accepted Original Fixed-Clock Cockpit UI
on:
  push:
    branches: ['codex/production-**']
    paths:
      - Tests/Production/CockpitUITiming/Reference/**
      - .github/workflows/preserve-production-cockpit-ui-timing.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: preserve-original-cockpit-ui-timing
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: dcajacob/orbiter-cross-platform
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify accepted run, exact artifacts, producer inputs and logs
        run: python3 -B Tests/Production/additional_references.py ui-timing --preserve out/accepted-original-ui-timing
      - name: Publish a new immutable prerelease without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          tag=production-windows-cockpit-ui-timing-v1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Accepted control reference release already exists; replacement is forbidden.'
            exit 1
          fi
          gh release create "$tag" out/accepted-original-ui-timing/* --target "$GITHUB_SHA" --prerelease --title 'Original Windows fixed-clock cockpit UI reference v1' --notes-file Tests/Production/CockpitUITiming/Reference/README.md
      - name: Independently download and verify public release storage
        run: python3 -B Tests/Production/additional_references.py ui-timing --cache out/public-control-cache --output out/public-control-verification
