name: Phase 6 All Four Original Rejection Profiles With Matching Hosted Compiler
on:
  push:
    branches: ['qualification/native-class-rejections-v8-host-compiler']
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-original-class-rejections-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve all original and new small controls
        run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/class-rejection-controls.json
      - name: Verify every frozen original negative class and metadata fixture before any simulator
        run: python3 -B Tests/Production/Closeout/hosted_class_rejections.py --source-preflight --output out/class-rejection-source-preflight.json
      - name: Require the exact independently reproduced complete joint API qualification
        uses: actions/github-script@v8
        with:
          script: |
            const {owner,repo}=context.repo,run_id=42723386812,head='480ce396475e17d66524ea60fbf9cb1a8a41ed4d';
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100});
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:13721672414})).data;
            const fs=require('fs'),crypto=require('crypto'),base='out/class-joint-reference';fs.mkdirSync(base,{recursive:true});
            fs.writeFileSync(base+'/api.json',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2),{flag:'wx'});
            if(owner!=='dcajacob'||repo!=='orbiter-cross-platform'||run.id!==run_id||run.head_sha!==head||run.head_branch!=='qualification/joint-general-api-v1'||run.path!=='.github/workflows/phase6-joint-general-api.yml'||run.run_attempt!==1||run.status!=='completed'||run.conclusion!=='success'||
               jobs.length!==2||new Set(jobs.map(j=>j.id)).size!==2||jobs.some(j=>![129522724889,129524147885].includes(j.id)||j.head_sha!==head||j.run_id!==run_id||j.status!=='completed'||j.conclusion!=='success'||JSON.stringify(j.labels)!==JSON.stringify(['ubuntu-24.04']))||
               artifact.id!==13721672414||artifact.name!=='independently-verified-joint-GeneralApi-reference'||artifact.expired||artifact.workflow_run.id!==run_id||artifact.workflow_run.head_sha!==head||artifact.size_in_bytes!==406619||artifact.digest!=='sha256:b7f3a541cfdec4443e51820f7977f7485ba42920f8349c771ae1a27f337beaa7')throw Error('Exact independently closed original joint API reference required');
            const bytes=Buffer.from((await require('./.github/scripts/phase6-download-bound-artifact.cjs')({github,owner,repo,source:{run,jobs},artifact,base,core})).data);
            if(bytes.length!==406619||crypto.createHash('sha256').update(bytes).digest('hex')!=='b7f3a541cfdec4443e51820f7977f7485ba42920f8349c771ae1a27f337beaa7')throw Error('Actual published joint prerequisite ZIP differs');
            fs.writeFileSync(base+'/producer.zip',bytes,{flag:'wx'});
      - name: Re-read the source-bound qualified receipt without claiming class acceptance
        run: |
          python3 -B - <<'PY'
          import hashlib,json,stat,zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('out/class-joint-reference/producer.zip') as incoming:
              seen=set();bodies={}
              for info in incoming.infolist():
                  if info.is_dir():continue
                  name=info.filename;p=PurePosixPath(name)
                  assert name and str(p)==name and not p.is_absolute() and '..' not in p.parts and ':' not in name and '\\' not in name
                  assert name.casefold() not in seen and not stat.S_ISLNK(info.external_attr>>16)
                  seen.add(name.casefold());bodies[name]=incoming.read(info)
              prefix='joint-api-qualification/proof/'
              proof=json.loads(bodies[prefix+'joint-proof.json']);qualified=json.loads(bodies[prefix+'qualification.json'])
              assert proof['status']=='qualified-complete-native-Windows-GeneralApi-only' and proof['source']=='480ce396475e17d66524ea60fbf9cb1a8a41ed4d'
              assert proof['github_run_id']==42723386812 and proof['independently_replayed_published_qualification'] is True
              assert proof['original_qualifier_sha256']=='4e13d325912ef33bfbe69d3448bfdf63443b3f95d82e22cdc2e9a325b32e634e'
              assert hashlib.sha256(bodies[prefix+'qualification.json']).hexdigest()==proof['qualified_report_sha256']=='3f346c8548d2a69dd288300ee31bbd0a2764b0b2015161b71edf894d996cbae0'
              assert qualified['status']=='qualified-general-api-correction-v2' and len(qualified['evidence_sha256'])==1125
              assert set(qualified['cohorts'])=={'native','current-windows'} and len(qualified['profiles'])==4
              assert qualified['normal_stock_admission_qualified'] is False and proof['phase6_complete'] is False
          print('Exact independently reproduced API prerequisite verified; class eligibility and normal admission remain pending')
          PY
      - uses: actions/github-script@v8
        with:
          script: |
            core.info(JSON.stringify(await require('./.github/scripts/phase6-download-bound-artifact.Test.cjs')({core})));
            core.info(JSON.stringify(await require('./.github/scripts/phase6-download-native-api-inputs.Test.cjs')({core})));
      - name: Reuse only the completed exact original package preflight while preserving all four failed profiles
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo;
            if(owner!=='dcajacob'||repo!=='orbiter-cross-platform'||(await github.rest.repos.get({owner,repo})).data.private)throw Error('Exact existing public repository required');
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:42806647208})).data;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:42806647208,per_page:100});
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:13761595407})).data;
            const base='out/original-rejection-package-prerequisite';fs.mkdirSync(base,{recursive:true});
            fs.writeFileSync(base+'/api.json',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2),{flag:'wx'});
            if(run.id!==42806647208||run.head_sha!=='b939aabdda71832a61646cf304ff211ee4cc50d4'||run.status!=='completed'||run.conclusion!=='failure'||artifact.id!==13761595407||artifact.size_in_bytes!==175698||artifact.digest!=='sha256:7dc1a4a4ac48548a8e088ae9a4ae4aa022eee91a60a04ccbda8e12cecb398c48')throw Error('Exact original closed package-only prerequisite required');
            const bytes=Buffer.from((await require('./.github/scripts/phase6-download-bound-artifact.cjs')({github,owner,repo,source:{run,jobs},artifact,base,core})).data);
            if(bytes.length!==175698||crypto.createHash('sha256').update(bytes).digest('hex')!=='7dc1a4a4ac48548a8e088ae9a4ae4aa022eee91a60a04ccbda8e12cecb398c48')throw Error('Actual original package preflight ZIP differs');
            fs.writeFileSync(base+'/producer.zip',bytes,{flag:'wx'});
      - name: Independently re-read every original exact package version and completed prerequisite command
        run: >-
          python3 -B Tests/Production/Closeout/verify_rejection_setup_receipt.py
          --api out/original-rejection-package-prerequisite/api.json
          --archive out/original-rejection-package-prerequisite/producer.zip
          --output out/original-rejection-package-prerequisite/verification.json
      - name: Download exact successful published original provisioning only for independent server-side audit
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/phase6-download-published-original-pool.cjs')({github,context,core});
      - name: Independently reproduce every original provisioning field and verify original snapshot signatures and signed package indexes
        run: >-
          python3 -B Tests/Production/Closeout/verify_published_original_pool.py
          --inputs out/original-pool-published-inputs --output out/original-pool-independent-replay.json
      - name: Require the exact completed real seven-fixture compiler component and unchanged compiler routing source
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:42884779058})).data;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:42884779058,per_page:100});
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:13795786658})).data;
            const base='out/original-fixture-compiler-prerequisite';fs.mkdirSync(base,{recursive:true});
            fs.writeFileSync(base+'/api.json',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2),{flag:'wx'});
            if(run.id!==42884779058||run.head_sha!=='4114a1703a67e46f07c78d697cd301923c2b7238'||run.head_branch!=='qualification/rejection-fixture-compiler-bridge-control-v1'||run.path!=='.github/workflows/phase6-rejection-fixture-compiler-control.yml'||run.run_attempt!==1||run.status!=='completed'||run.conclusion!=='success'||jobs.length!==1||jobs[0].id!==130070089720||jobs[0].status!=='completed'||jobs[0].conclusion!=='success'||JSON.stringify(jobs[0].labels)!==JSON.stringify(['ubuntu-24.04'])||artifact.id!==13795786658||artifact.size_in_bytes!==186066||artifact.digest!=='sha256:9dc47c384935fffe1afa5e7cf81362ad1096e819a745aaaba7bfdd9429d11b4f'||artifact.expired||artifact.workflow_run.id!==run.id||artifact.workflow_run.head_sha!==run.head_sha)throw Error('Exact real seven-compiler-process prerequisite required');
            const bytes=Buffer.from((await require('./.github/scripts/phase6-download-bound-artifact.cjs')({github,owner,repo,source:{run,jobs},artifact,base,core})).data);
            if(bytes.length!==186066||crypto.createHash('sha256').update(bytes).digest('hex')!=='9dc47c384935fffe1afa5e7cf81362ad1096e819a745aaaba7bfdd9429d11b4f')throw Error('Actual compiler component ZIP differs');
            fs.writeFileSync(base+'/producer.zip',bytes,{flag:'wx'});
      - name: Re-read actual compiler component output bytes without granting runtime qualification
        run: |
          python3 -B - <<'PYCOMPILER'
          import hashlib,json,zipfile
          from pathlib import Path
          from sys import path
          path.insert(0,'Tests/Production/Closeout')
          from rejection_fixture_compiler_bridge import expected_argv
          with zipfile.ZipFile('out/original-fixture-compiler-prerequisite/producer.zip') as z:
              base='rejection-fixture-compiler/Debug-sse2/'
              r=json.loads(z.read(base+'compiler-bridge.json'))
              assert r['source']=='4114a1703a67e46f07c78d697cd301923c2b7238' and r['status']=='all-seven-original-fixture-compiler-processes-completed'
              assert r['bridge_source_sha256']==hashlib.sha256(Path('Tests/Production/Closeout/rejection_fixture_compiler_bridge.py').read_bytes()).hexdigest()
              assert r['host_preprocessor']['actual_cpp_abi']==r['actual_engine_CPP_ABI']=='gcc-13.3.0:libstdc++-20240904-abi-1-normal-gxx-1018:201703L'
              assert r['compiler_version_or_ABI_macros_overridden'] is False and r['original_fixture_or_collector_argv_changed'] is False and len(r['requests'])==7
              identities=set()
              for item in r['requests']:
                  i=item['index'];receipt=json.loads(z.read(base+'compile-'+str(i)+'-process.json'))
                  observed=next(v for v in receipt['owned_process_identities'] if v['pid']==receipt['actual_collector_pid'])
                  assert item['original_requested_argv']==item['actual_host_argv']==observed['argv']==expected_argv('Debug-sse2',i)
                  assert item['actual_returncode']==receipt['actual_returncode']==0 and receipt['cancelled'] is False and receipt['terminal'] is True and observed['start_ticks']>0
                  identities.add((observed['pid'],observed['start_ticks']))
                  assert hashlib.sha256(z.read('native-class-rejections/Debug-sse2/fixtures/metadata-'+str(i)+'.so')).hexdigest()==item['output_sha256']
              assert len(identities)==7
          print('Exact actual compiler processes and bodies verified; all180 original runtime controls and raw replay still required')
          PYCOMPILER
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-class-rejections-readiness
          retention-days: 14
          path: |
            out/original-pool-independent-replay.json
            out/original-pool-published-inputs/api.json
            out/original-pool-published-inputs/*/*.json
            out/original-pool-published-inputs/signature-audit/*.log
            out/original-pool-published-inputs/signature-audit/*.json
            out/original-fixture-compiler-prerequisite/*.json
            out/class-rejection-controls.json
            out/class-rejection-source-preflight.json
            out/class-rejection-provisioning-deadline.json
            out/class-joint-reference/*.json
            out/class-joint-reference/*.body
            out/original-rejection-package-prerequisite/**
            out/class-userspace-preflight/**
            out/class-userspace-container.json
            out/class-userspace-container.log
            out/native-rejection-network/**
            out/native-api-source/providers/*.json
            out/native-api-source/providers/*.body
            out/native-provider-restoration/restoration.json
  capture:
    name: Original normal host class and loader rejection controls ${{ matrix.profile }}
    needs: readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [Debug-automatic, Debug-sse2, Release-automatic, Release-sse2]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Stage the exact preserved original Windows application SDK and HST DLL without Windows execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          configuration="${PROFILE%%-*}"
          python3 -B Tests/Production/CockpitControls/prepare.py --configuration "$configuration" --cache out/rejection-preserved-cache --output "out/rejection-preserved/$configuration"
      - name: Retain the exact compiled application and provider inputs without changing failed producer history
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/phase6-download-native-api-inputs.cjs')({github,context,core});
      - name: Restore every retained native binary and original unit result with exact corrected discovery
        run: >-
          python3 -B Tests/Production/Closeout/recheck_native_discovery.py
          --api out/native-api-source/native/api.json --archive out/native-api-source/native/producer.zip
          --profile "$PROFILE" --output "out/native-rejection-retained-units/$PROFILE"
      - name: Restore unchanged provider bytes links and original negative controls
        run: >-
          python3 -B Tests/Production/Closeout/restore_hosted_native_providers.py
          --api out/native-api-source/providers/api.json --archive out/native-api-source/providers/producer.zip
          --output out/native-provider-restoration/restoration.json
      - name: Restore separately compiled unsuppressed Mesa owner repair and controls
        run: >-
          python3 -B Tests/Production/Closeout/restore_hosted_mesa_topology.py
          --api out/native-api-source/mesa/api.json --archive out/native-api-source/mesa/producer.zip
          --output out/mesa-topology-restoration/restoration.json
      - name: Run all45 original normal host rejection controls with exact matching hosted userspace
        shell: bash
        run: |
          set -euo pipefail
          image=$(python3 -c "import json; print('ubuntu@'+json.load(open('Tests/Production/Closeout/native-provider-container.lock.json'))['image_digest'])")
          docker pull "$image"
          docker image inspect "$image" > out/native-rejection-container.json
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS,GITHUB_WORKSPACE,GITHUB_SHA,PROFILE python3 -B Tests/Production/Closeout/rejection_fixture_compiler_bridge.py serve --profile "$PROFILE" > out/fixture-compiler-server.log 2>&1 &
          fixture_bridge_pid=$!
          cleanup_fixture_bridge() {
            if test -f "out/rejection-fixture-compiler/$PROFILE/server.pid"; then
              fixture_service_pid=$(cat "out/rejection-fixture-compiler/$PROFILE/server.pid")
              if [[ "$fixture_service_pid" =~ ^[1-9][0-9]*$ ]]; then sudo -n kill "$fixture_service_pid" 2>/dev/null || true; fi
            fi
            kill "$fixture_bridge_pid" 2>/dev/null || true
          }
          trap cleanup_fixture_bridge EXIT
          for probe_index in $(seq 1 100); do
            test ! -f "out/rejection-fixture-compiler/$PROFILE/ready" || break
            kill -0 "$fixture_bridge_pid"
            sleep .1
          done
          test -f "out/rejection-fixture-compiler/$PROFILE/ready"
          docker run --rm --init --cpus=2 --shm-size=1g -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /etc/ssl/certs/ca-certificates.crt:/run/orbiter-ci-system-ca.pem:ro -w "$GITHUB_WORKSPACE" \
            -e GITHUB_ACTIONS -e RUNNER_OS -e GITHUB_WORKSPACE -e GITHUB_SHA -e PROFILE \
            "$image" bash Tests/Production/Closeout/prepare_hosted_class_rejections_compiler_bridge_network.sh Tests/Production/Closeout/prepare_hosted_class_rejections_compiler_bridge.sh 2>&1 | tee out/native-rejection-container.log
          wait "$fixture_bridge_pid"
          python3 -B Tests/Production/Closeout/rejection_fixture_compiler_bridge.py verify --profile "$PROFILE"
      - name: Preserve bounded actual failure diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for pattern in ('out/hosted-native-class-rejections/*/*.log','out/native-class-rejections/*/*/*.log','out/native-class-rejections/*/fixtures/*.log'):
              for p in sorted(Path('.').glob(pattern)):
                  print(str(p)+':\n'+p.read_text(errors='replace')[-12000:])
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-class-normal-host-rejection-controls-${{ matrix.profile }}
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
          path: |
            out/rejection-fixture-compiler/${{ env.PROFILE }}/*.json
            out/rejection-fixture-compiler/${{ env.PROFILE }}/*.log
            out/rejection-fixture-compiler/${{ env.PROFILE }}/container-compiler-adapter
            out/fixture-compiler-server.log
            Tests/Production/Closeout/rejection_fixture_compiler_bridge.py
            Tests/Production/Closeout/prepare_hosted_class_rejections_compiler_bridge*.sh
            out/original-package-official-pool/${{ env.PROFILE }}/**
            out/class-rejection-official-pool-source/${{ env.PROFILE }}/**
            Tests/Production/Closeout/prepare_original_packages_from_official_pool.sh
            Tests/Production/Closeout/prepare_hosted_class_rejections_official_pool*.sh
            out/hosted-native-class-rejections/${{ env.PROFILE }}/**
            out/native-api-source/*/*.json
            out/native-api-source/*/*.body
            out/native-rejection-retained-units/${{ env.PROFILE }}/**
            out/native-rejection-network/${{ env.PROFILE }}/**
            out/native-rejection-container.json
            out/native-rejection-container.log
            out/native-stock-assets/remaining-vessels-resources.json
            out/native-stock-assets/resources.json
            out/native-stock-assets/cockpit-test-font.json
            out/phase6-hosted-native/${{ env.PROFILE }}/build.json
            out/native-provider-restoration/restoration.json
            out/mesa-topology-restoration/restoration.json
      - name: Preserve raw partial files if lossless packing itself failed
        uses: actions/upload-artifact@v7
        if: failure() && hashFiles('out/hosted-native-class-rejections/*/raw-index.json') == ''
        with:
          name: unqualified-original-rejection-partial-files-${{ matrix.profile }}
          retention-days: 14
          compression-level: 3
          include-hidden-files: true
          path: |
            out/native-class-rejections/${{ env.PROFILE }}/**
            out/rejection-preserved/**
