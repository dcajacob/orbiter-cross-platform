name: Phase 6 Exact Scalar Frame Comparator Controls

on:
  push:
    branches: ['qualification/hosted-ssim-controls']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase6-hosted-ssim-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/hosted-ssim-helper-controls.json
      - name: Download only the actual completed original frame producer on GitHub
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner,repo} = context.repo;
            if (owner!=='dcajacob' || repo!=='orbiter-cross-platform') throw Error('Exact authorized source repository required');
            const run_id=42515116858, artifact_id=13638968833;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;
            const jobs=(await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100})).filter(j=>j.id===128839665625);
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id})).data;
            if (run.head_sha!=='f9bf6c7814965cd897f349f97890d9e005cbb66d' || jobs.length!==1 || jobs[0].status!=='completed' || jobs[0].conclusion!=='success' || artifact.expired || artifact.digest!=='sha256:097116cce0bcda507c0546c98933155cb95e423c24f1ca58a387e235ac6a408d' || artifact.size_in_bytes!==458096852) throw Error('Exact completed frame job and API artifact required');
            const response=await github.rest.actions.downloadArtifact({owner,repo,artifact_id,archive_format:'zip'});
            const bytes=Buffer.from(response.data);
            if ('sha256:'+crypto.createHash('sha256').update(bytes).digest('hex')!==artifact.digest || bytes.length!==artifact.size_in_bytes) throw Error('Actual API archive digest/length differs');
            fs.mkdirSync('out/hosted-ssim-source',{recursive:true});
            fs.writeFileSync('out/hosted-ssim-source/producer.zip',bytes);
            fs.writeFileSync('out/hosted-ssim-source/api.json',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2));
      - name: Prove exact original scalar arithmetic on five controls and two real nonidentical full-frame pairs
        run: >-
          python3 -B Tests/Production/Closeout/verify_hosted_ssim.py
          --api out/hosted-ssim-source/api.json --archive out/hosted-ssim-source/producer.zip
          --output out/hosted-ssim-controls
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-bit-identical-scalar-ssim-controls
          retention-days: 14
          compression-level: 3
          path: |
            out/hosted-ssim-controls/**
            out/hosted-ssim-source/api.json
            out/hosted-ssim-helper-controls.json
