name: Windows ShuttlePB Ground Flight Reference

on:
  push:
    branches: ['codex/production-**']
    paths: ['Tests/Production/GroundFlight/**', 'Tests/Production/BehaviorDriver.cpp', '.github/workflows/production-ground-reference.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  behavior:
    name: Production behavior ${{ matrix.configuration }} x64
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DXSDK_DIR: '${{ github.workspace }}\DXSDK'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/cache@v6
        id: dxsdk
        with:
          path: '${{ github.workspace }}\DXSDK'
          key: dxsdk_jun10
      - name: Prepare existing SDK dependency
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl --fail -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o DXSDK_Jun10.exe
          if errorlevel 1 exit /b 1
          7z x DXSDK_Jun10.exe DXSDK/Include DXSDK/Lib
          if errorlevel 1 exit /b 1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41342204437
          name: production-runtime-${{ matrix.configuration }}-x64
          path: out/runtime-archive
      - uses: actions/checkout@v7
        with:
          ref: 391919027ac3e4a4d42f145373c788fc859c32cd
          path: out/frozen-source
      - name: Verify the pre-flight application and SDK byte-for-byte
        shell: pwsh
        run: |
          Expand-Archive out/runtime-archive/windows-test-runtime.zip out/production-app
          $runtime = "$pwd/out/production-app"
          Push-Location out/frozen-source
          python Tests/Production/verify_test_runtime.py --runtime "$runtime" --source 391919027ac3e4a4d42f145373c788fc859c32cd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Compile the current controls/observation driver against that build
        shell: pwsh
        run: |
          cmake -S Tests/Production/BehaviorBuild -B out/driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/production-app" 2>&1 | Tee-Object ground-driver-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/driver --parallel 2 2>&1 | Tee-Object ground-driver-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Prepare locked physics and terrain data
        run: |
          python Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          python Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
      - name: Observe original ShuttlePB atmosphere, terrain contact, takeoff/landing and landed serialization
        run: >-
          python Tests/Production/GroundFlight/reference.py --orbiter out/production-app/Orbiter.exe
          --data out/production-data --planets out/standard-planets --output out/production-behavior
          --configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ground-flight-reference-${{ matrix.configuration }}
          path: |
            ground-driver-*.log
            out/driver/CMakeCache.txt
            out/production-app/test-runtime.json
            out/production-behavior/**/*.csv
            out/production-behavior/**/*.json
            out/production-behavior/**/*.txt
            out/production-behavior/**/*.log
            out/production-behavior/**/*.scn
            out/production-behavior/**/Orbiter.cfg
  compare:
    needs: behavior
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ground-flight-reference-Debug
          path: out/debug
      - uses: actions/download-artifact@v8
        with:
          name: ground-flight-reference-Release
          path: out/release
      - name: Compare production behavior in both configurations
        run: python3 -B Tests/Production/GroundFlight/reference.py --compare out/debug/production-behavior --output out/release/production-behavior
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ground-flight-reference-comparison
          path: out/release/production-behavior/ground-flight-report.json
