name: Orbiter Phase 8 packages and clean installs

on:
  push:
    branches: [qualification/phase8-packages-v1, qualification/phase8-windows-v3, qualification/phase8-install-review-v1]
    paths: [.github/workflows/phase8-packages.yml, Tests/Production/Packages/**]

permissions:
  contents: read

jobs:
  macos:
    if: github.ref_name != 'qualification/phase8-windows-v3'
    name: macOS package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            cspice_path: MacIntel_OSX_AppleC_64bit
            cspice_sha: 6f4980445fee4d363dbce6f571819f4a248358d2c1bebca47e0743eedfe9935e
          - runner: macos-15
            arch: arm64
            cspice_path: MacM1_OSX_clang_64bit
            cspice_sha: 0deae048443e11ca4d093cac651d9785d4f2594631a183d85a3d58949f4d0aa9
    env:
      ORBITER_BASELINE: 9609ce48ace63f29ecbd7998c4e3e921b992e834
      ORBITER_MAC_STOCK: 39d93da2010cfcdeb60005543f2179131ec831ba
      ORBITER_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and native architecture
        id: identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ORBITER_MAC_STOCK" HEAD
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "$ORBITER_ARCH"
          mkdir -p out/receipt
          {
            printf 'Source: %s\nBaseline: %s\nArchitecture: %s\n' "$GITHUB_SHA" "$ORBITER_BASELINE" "$ORBITER_ARCH"
            sw_vers
            clang --version
          } | tee out/receipt/source.txt
          git diff --exit-code "$ORBITER_MAC_STOCK" HEAD -- Src/Orbiter/SuperVessel.cpp Tests/Production/PhysicsV3 Tests/Portable Scenarios
          python3 -B Tests/Production/frozen_reference.py
          python3 -B Tests/Production/frozen_behavior.py
      - name: Verify renderer and original planetary dependencies
        shell: bash
        env:
          CSPICE_PATH: ${{ matrix.cspice_path }}
          CSPICE_SHA: ${{ matrix.cspice_sha }}
        run: |
          python3 -B Tests/Production/NativeScene/dependencies.py --cache out/ogl-dependencies
          curl --fail --silent --show-error --location --retry 2 \
            "https://naif.jpl.nasa.gov/pub/naif/toolkit/C/$CSPICE_PATH/packages/cspice.tar.Z" -o out/cspice.tar.Z
          printf '%s  out/cspice.tar.Z\n' "$CSPICE_SHA" | shasum -a 256 -c -
          tar -xf out/cspice.tar.Z -C out cspice/lib/cspice.a cspice/include
          test "$(lipo -archs out/cspice/lib/cspice.a)" = "$ORBITER_ARCH"
          shasum -a 256 out/cspice.tar.Z out/cspice/lib/cspice.a | tee out/receipt/cspice.txt
          mkdir -p out/glfw
          curl -fsSL https://codeload.github.com/glfw/glfw/tar.gz/refs/tags/3.5.1 -o out/glfw.tar.gz
          echo '5234f4f29473e9a06bc7847d8371858dd135d38466eeeaa652fdc9f8f9ff0c20  out/glfw.tar.gz' | shasum -a 256 -c -
          tar -xzf out/glfw.tar.gz --strip-components=1 -C out/glfw
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('out/glfw/src/nsgl_context.m')
          body = p.read_text()
          requested = '    ADD_ATTRIB(NSOpenGLPFAAccelerated);'
          if body.count(requested) != 1:
              raise ValueError('Pinned NSGL backend differs')
          p.write_text(body.replace(requested, '    /* Hosted diagnostic: permit the Apple software device. */'))
          PYTHON
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('out/glfw/src/cocoa_window.m')
          body = p.read_text()
          anchor = '@implementation GLFWWindow\n'
          if body.count(anchor) != 1:
              raise ValueError('Pinned Cocoa window class differs')
          # Keep the required 1280x720 framebuffer on the smaller hosted display.
          method = (
              '- (NSRect)constrainFrameRect:(NSRect)frame toScreen:(NSScreen*)screen\n'
              '{\n    (void)screen;\n    return frame;\n}\n'
          )
          p.write_text(body.replace(anchor, anchor + method))
          PYTHON
          shasum -a 256 out/glfw/src/nsgl_context.m out/glfw/src/cocoa_window.m | tee out/receipt/software-nsgl-source.txt
      - name: Build the production native cockpit and required stock modules
        id: engine
        shell: bash
        run: |
          cmake -S Src/Orbiter/Production -B out/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON "-DCMAKE_INSTALL_RPATH=@loader_path;@loader_path/..;@loader_path/../..;@loader_path/../../..;@loader_path/../../../.." \
            -DCMAKE_OSX_ARCHITECTURES="$ORBITER_ARCH" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DORBITER_BUILD_NATIVE_VESSELS=ON -DORBITER_BUILD_NATIVE_COCKPIT=ON \
            -DORBITER_BUILD_NATIVE_CELESTIAL_MODULES=ON "-DORBITER_MACOS_CSPICE_ROOT=$PWD/out/cspice" \
            -DBUILD_TESTING=OFF 2>&1 | tee out/receipt/configure.log
          cmake --build out/native --parallel 3 --target orbiter-production native_deltaglider native_shuttle_a \
            native_shuttle_a_payload native_lua_inline native_lua_mfd native_xrsound native_atlantis native_atlantis_tank native_atlantis_srb native_hst native_solar_sail native_quadcopter native_dragonfly orbiter_native_spice orbiter_native_EarthAtmJ71G orbiter_native_EarthAtm2006 orbiter_native_MarsAtm2006 \
            -- -k 0 2>&1 | tee out/receipt/build.log
          test "$(lipo -archs out/native/orbiter-production)" = "$ORBITER_ARCH"
          test "$(lipo -archs out/native/NativeModules/Plugin/LuaInline.so)" = "$ORBITER_ARCH"
          shasum -a 256 out/native/orbiter-production out/native/NativeModules/Vessel/*.so \
            out/native/NativeModules/Plugin/LuaInline.so out/native/NativeModules/Plugin/LuaInterpreter.dylib | tee out/receipt/binaries.txt
          out/native/orbiter-production --help | tee out/receipt/production-help.txt
      - name: Build the actual production OpenGL renderer for Cocoa
        id: renderer
        shell: bash
        run: |
          cmake -S OVP/OGLClient/Native -B out/renderer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON "-DCMAKE_INSTALL_RPATH=@loader_path/../.." \
            -DCMAKE_OSX_ARCHITECTURES="$ORBITER_ARCH" "-DORBITER_ENGINE_BUILD=$PWD/out/native" \
            "-DORBITER_RENDERER_DEPENDENCIES=$PWD/out/ogl-dependencies" \
            "-DFETCHCONTENT_SOURCE_DIR_GLFW=$PWD/out/glfw" 2>&1 | tee out/receipt/renderer-configure.log
          cmake --build out/renderer --parallel 3 --target orbiter_ogl_native -- -k 0 2>&1 | tee out/receipt/renderer-build.log
          test "$(lipo -archs out/native/NativeModules/Graphics/OGLClient.so)" = "$ORBITER_ARCH"
          shasum -a 256 out/native/NativeModules/Graphics/OGLClient.so | tee -a out/receipt/binaries.txt
      - uses: actions/cache/restore@v6
        with:
          path: out/data-cache/production-stock-data-v1.zip
          key: production-native-data-${{ hashFiles('Tests/Production/input-storage.lock.json') }}
      - uses: actions/cache/restore@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Stage the verified stock scene and licensed test resources
        id: data
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/orbiter-inputs"
          python3 -B Tests/Production/prepare_native_data.py --archive out/data-cache/production-stock-data-v1.zip --destination "$RUNNER_TEMP/orbiter-inputs/data" --group all
          python3 -B Tests/Production/prepare_hosted_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination "$RUNNER_TEMP/orbiter-inputs/planets"
          python3 -B Tests/Production/NativeScene/prepare.py --delta-glider --shuttle-a --data "$RUNNER_TEMP/orbiter-inputs/data" --planets "$RUNNER_TEMP/orbiter-inputs/planets" --destination "$RUNNER_TEMP/orbiter-inputs/assets"
          python3 -B Tests/Production/CockpitUI/prepare_fonts.py --assets "$RUNNER_TEMP/orbiter-inputs/assets"
      - name: Deploy Qt and archive the native package
        shell: bash
        run: |
          python3 -m venv out/qt-tools
          out/qt-tools/bin/python -m pip install 'aqtinstall==3.3.0'
          out/qt-tools/bin/python -m aqt install-qt mac desktop 6.8.3 clang_64 --outputdir out/qt
          cmake_config=$(find "$PWD/out/qt/6.8.3" -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)
          test -f "$cmake_config"
          qt="${cmake_config%/lib/cmake/Qt6/Qt6Config.cmake}"
          cmake -S Utils/Launchpad -B out/launchpad -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$ORBITER_ARCH" "-DCMAKE_PREFIX_PATH=$qt"
          cmake --build out/launchpad --parallel 3
          python3 -B Tests/Production/Packages/native.py stage --engine out/native --destination out/package
          cmake --install out/launchpad --prefix "$PWD/out/package"
          app=out/package/orbiter-launchpad.app
          "$qt/bin/macdeployqt" "$app" -no-strip
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/orbiter-launchpad")" = "$ORBITER_ARCH"
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          find out/package -type f \( -name '*.dylib' -o -name '*.so' -o -name orbiter-production \) \
            -not -path '*.app/*' -exec otool -l -L {} + > out/receipt/native-linkage.txt
          if rg -F -e "$PWD" out/receipt/native-linkage.txt; then
            echo 'Installed native code contains a build-time library path'
            exit 1
          fi
          python3 -B Tests/Production/Packages/native.py manifest --destination out/package --source "$GITHUB_SHA"
          COPYFILE_DISABLE=1 tar -czf "out/Orbiter-macos-$ORBITER_ARCH.tar.gz" -C out/package .
      - name: Verify the extracted package outside the checkout
        shell: bash
        run: |
          python3 -B Tests/Production/Packages/native.py verify \
            --archive "out/Orbiter-macos-$ORBITER_ARCH.tar.gz" --source "$GITHUB_SHA" \
            --assets "$RUNNER_TEMP/orbiter-inputs/assets" --data "$RUNNER_TEMP/orbiter-inputs/data" \
            --planets "$RUNNER_TEMP/orbiter-inputs/planets" --output out/receipt/clean-install
      - name: Retain macOS package and clean-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase8-macos-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            out/Orbiter-macos-*.tar.gz
            out/receipt/
  windows:
    name: Windows x64 package
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ORBITER_PHYSICS: ef2401bb059f429aec3b1d7880e58f94f8a7a56f
      DXSDK_DIR: '${{ github.workspace }}\DXSDK'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify source and frozen guards
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong source' }
          if (git diff --name-only $env:ORBITER_PHYSICS HEAD -- Src/Orbiter/SuperVessel.cpp Tests/Production/PhysicsV3) {
            throw 'The approved v3 physics or its original guard changed'
          }
          New-Item -ItemType Directory -Path out/receipt | Out-Null
          "$env:GITHUB_SHA" | Set-Content out/receipt/source.txt
          python -B Tests/Production/frozen_reference.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/frozen_behavior.py
          exit $LASTEXITCODE
      - uses: actions/cache/restore@v6
        id: dxsdk
        with:
          path: ${{ github.workspace }}\DXSDK
          key: dxsdk_jun10
      - name: Prepare the existing DirectX SDK dependency
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl --fail -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o DXSDK_Jun10.exe
          if errorlevel 1 exit /b 1
          7z x DXSDK_Jun10.exe DXSDK/Include DXSDK/Lib
          if errorlevel 1 exit /b 1
      - name: Build Windows Release
        id: app
        run: |
          cmake -S . -B out/app -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DORBITER_BUILD_D3D9CLIENT=ON -DORBITER_BUILD_XRSOUND=ON -DORBITER_MAKE_DOC=OFF -DORBITER_MAKE_TESTS=ON -DORBITER_PORTABLE_REFERENCE_CAPTURE=ON -DORBITER_PRODUCTION_REFERENCE_CAPTURE=ON "-DDXSDK_DIR:PATH=$env:DXSDK_DIR" 2>&1 | Tee-Object out/receipt/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/app --parallel 4 -- -k 0 2>&1 | Tee-Object out/receipt/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/build_metadata.py --build out/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item out/app/build-inputs.json out/receipt/build-inputs.json
      - name: Verify the same-build SDK and build the OpenGL client
        id: runtime
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: |
          python -B Tests/Production/package_test_runtime.py --build out/app --output out/runtime.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x out/runtime.zip -oout/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/verify_test_runtime.py --runtime out/runtime --source $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 -Path out/runtime/Modules/Plugin/ScnEditor.dll,out/runtime/Modules/Plugin/XRSound.dll |
            ConvertTo-Json | Set-Content out/receipt/windows-addons.json
          cmake -S OVP/OGLClient -B out/ogl -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DORBITER_TEST_RUNTIME=$pwd/out/runtime" "-DDXSDK_DIR=$env:DXSDK_DIR" 2>&1 | Tee-Object out/receipt/client-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/ogl --target OGLClient --parallel 2 2>&1 | Tee-Object out/receipt/client-build.log
          exit $LASTEXITCODE
      - name: Install and deploy Windows preview
        id: package
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir out/qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qt = "$pwd/out/qt/6.8.3/msvc2022_64"
          cmake --install out/app --prefix "$pwd/out/install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = "$pwd/out/install/Orbiter"
          if (!(Test-Path "$install/Orbiter.exe")) { throw 'Missing installed Windows application' }
          Copy-Item out/runtime/Modules/Plugin/OGLClient.dll "$install/Modules/Plugin"
          New-Item -ItemType Directory -Force "$install/Modules/OGLClient" | Out-Null
          Copy-Item out/runtime/Modules/OGLClient/* "$install/Modules/OGLClient" -Recurse
          Copy-Item Tests/Production/Packages/README.md "$install/Package-README.md"
          if (Test-Path "$install/Fonts/architext.regular.ttf") {
            Remove-Item "$install/Fonts/architext.regular.ttf"
          }
          cmake -S Utils/Launchpad -B out/launcher -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/launcher --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item out/launcher/orbiter-launchpad.exe "$install"
          & "$qt/bin/windeployqt.exe" --release --no-translations "$install/orbiter-launchpad.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$install/platforms/qwindows.dll")) { throw 'Qt Windows platform plugin missing' }
          python -B Tests/Production/Packages/native.py manifest --destination "$install" --source $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import shutil; shutil.make_archive('out/Orbiter-windows-x64', 'zip', 'out/install/Orbiter')"
          exit $LASTEXITCODE
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        with:
          path: out/data-cache/production-stock-data-v1.zip
          key: production-native-data-${{ hashFiles('Tests/Production/input-storage.lock.json') }}
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - name: Stage the locked stock data and renderer
        id: data
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          python -B Tests/Production/prepare_native_data.py --archive out/data-cache/production-stock-data-v1.zip --destination out/production-data --group all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/CockpitUI/prepare_fonts.py --assets out/production-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/prepare_hosted_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/stage_mesa.py stage --cache out/mesa-cache --destination out/mesa-runtime
          exit $LASTEXITCODE
      - name: Verify the extracted package outside the checkout
        run: |
          cmake -S Tests/Production/Packages -B out/package-probe -G Ninja -DCMAKE_BUILD_TYPE=Release "-DORBITER_TEST_RUNTIME=$pwd/out/runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/package-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/Packages/windows.py --archive out/Orbiter-windows-x64.zip --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime --probe out/package-probe/LaunchpadFlightProbe.dll --output out/receipt/clean-install --source $env:GITHUB_SHA
          exit $LASTEXITCODE
      - name: Retain Windows package and clean-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase8-windows-x64-v3
          retention-days: 7
          if-no-files-found: error
          path: |
            out/Orbiter-windows-x64.zip
            out/receipt/
