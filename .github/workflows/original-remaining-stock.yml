name: Preserved Windows Remaining Stock Module Reference
on:
  push:
    branches: ['codex/production-**']
    paths: ['Tests/Production/RemainingStock/**', 'Tests/Production/StockVessels/Driver.cpp', 'Tests/Production/StockVessels/Observation.h', 'Tests/Production/StockVessels/original.py', 'Tests/Production/ApplicationObservation.h', '.github/workflows/original-remaining-stock.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-remaining-stock-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_remaining_stock:
    name: Original remaining stock ${{ matrix.configuration }} ${{ matrix.math_profile }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/cache@v6
        with:
          path: out/cockpit-cache
          key: original-cockpit-control-runtime-${{ matrix.configuration }}-${{ hashFiles('Tests/Production/Cockpit/Reference/provenance.json') }}
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - name: Stage unchanged application, client, SDK, data and software OpenGL
        shell: pwsh
        run: |
          python -B Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/stage_mesa.py stage --cache out/mesa-cache --destination out/mesa-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/CockpitControls/prepare.py --configuration ${{ matrix.configuration }} --cache out/cockpit-cache --output out/remaining-stock-original-runtime
          exit $LASTEXITCODE
      - name: Build only the public SDK observation module
        shell: pwsh
        run: |
          cmake -S Tests/Production/RemainingStock -B out/remaining-stock-driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DORBITER_TEST_RUNTIME="$pwd/out/remaining-stock-original-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/remaining-stock-driver --parallel 2
          exit $LASTEXITCODE
      - name: Check sampled resource-history reader controls
        run: python -B Tests/Production/RemainingStock/Resources.Test.py
      - name: Select original SSE2 CRT when required
        if: matrix.math_profile == 'sse2'
        shell: pwsh
        run: '"ORBITER_TEST_OBSERVER_SSE2=1" >> $env:GITHUB_ENV'
      - name: Observe every vessel, attachment, thruster, tank and mesh in all 38 complete scenes twice
        run: >-
          python -B Tests/Production/RemainingStock/original.py
          --executable out/remaining-stock-original-runtime/Orbiter.exe --data out/production-data
          --planets out/standard-planets --mesa out/mesa-runtime
          --configuration ${{ matrix.configuration }} --math-profile ${{ matrix.math_profile }}
          --output out/remaining-stock-original
      - name: Reject incomplete launch stacks, tanks, attachments, meshes and playback inputs
        run: >-
          python -B Tests/Production/RemainingStock/Gate.Test.py
          --capture out/remaining-stock-original/remaining_stock_003-1
          --retired-capture out/remaining-stock-original/remaining_stock_001-1
          --output out/remaining-stock-original/gate-control.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-remaining-stock-${{ matrix.configuration }}-${{ matrix.math_profile }}
          retention-days: 90
          path: |
            out/remaining-stock-original/capture.json
            out/remaining-stock-original/gate-control.json
            out/remaining-stock-original/*/*.csv
            out/remaining-stock-original/*/*.rgba
            out/remaining-stock-original/*/*.png
            out/remaining-stock-original/*/*.json
            out/remaining-stock-original/*/*.txt
            out/remaining-stock-original/*/*.log
            out/remaining-stock-original/*/Scenarios/**/*.scn
            out/remaining-stock-original/*/Flights/**/*
            out/remaining-stock-original/*/Orbiter.cfg
            out/remaining-stock-original/*/Meshes/Dragonfly/Dragonfly.msh
            out/remaining-stock-original-runtime/control-reference-runtime.json
            out/remaining-stock-original-runtime/test-runtime.json
            out/remaining-stock-original-runtime/Modules/Plugin/ProductionCockpitDriver.dll
            out/remaining-stock-driver/CMakeCache.txt
            out/remaining-stock-driver/compile_commands.json
