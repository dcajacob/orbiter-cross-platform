name: Native Production OpenGL External View
on:
  push:
    branches: ['codex/production-**']
    paths: ['Src/Orbiter/**', 'Src/Celbody/**', 'Src/Vessel/ShuttlePB/**', 'Src/Vessel/DeltaGlider/**', 'Src/Vessel/Common/**', 'Src/Vessel/ShuttleA/Help/**', 'Src/Vessel/ShuttleA/ShuttleALua.cpp', 'Src/Vessel/Atlantis/Help/**', 'Src/Plugin/ScnEditor/Help/**', 'Src/Module/LuaScript/**', 'Extern/Lua/**', 'Extern/ReferenceMath/**', 'Extern/ldoc/**', 'Extern/Penlight/**', 'Extern/luafilesystem/**', 'OVP/OGLClient/**', 'Orbitersdk/**', 'Html/**', 'Tests/Production/**', '.github/workflows/native-production-client.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-production-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Real native client Ubuntu 24.04 ${{ matrix.configuration }} ${{ matrix.math_profile }} x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install native build and software OpenGL window dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y zlib1g-dev libgl1-mesa-dev
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb mesa-utils libmpfr-dev
      - name: Verify native math against unchanged Windows primitives and independent MPFR
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Src/Orbiter/Production/Math -B out/native-math -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} 2>&1 | tee native-math-configure.log
          cmake --build out/native-math --parallel 2 2>&1 | tee native-math-build.log
          ctest --test-dir out/native-math --output-on-failure 2>&1 | tee native-math-verification.log
      - name: Build the pinned native Lua library, interpreter worker and handoff test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Src/Module/LuaScript/Native -B out/native-lua -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} 2>&1 | tee native-lua-configure.log
          cmake --build out/native-lua --parallel 2 2>&1 | tee native-lua-build.log
          ctest --test-dir out/native-lua --output-on-failure 2>&1 | tee native-lua-verification.log
      - name: Build actual production engine and source-built stock/celestial modules
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Src/Orbiter/Production -B out/native-engine -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=OFF -DORBITER_BUILD_NATIVE_CELESTIAL_MODULES=ON -DORBITER_BUILD_NATIVE_VESSELS=ON -DORBITER_MATH_FORCE_SSE2=${{ matrix.math_profile == 'sse2' && 'ON' || 'OFF' }} 2>&1 | tee native-engine-configure.log
          cmake --build out/native-engine --parallel 2 2>&1 | tee native-engine-build.log
      - uses: actions/cache@v6
        with:
          path: out/ogl-dependencies
          key: native-production-ogl-${{ hashFiles('OVP/OGLClient/dependencies.lock.json', 'Src/ClientNative/CMakeLists.txt') }}
      - run: python3 -B Tests/Production/NativeScene/dependencies.py --cache out/ogl-dependencies
      - name: Build separate shared production OpenGL renderer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S OVP/OGLClient/Native -B out/native-renderer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_ENGINE_BUILD="$PWD/out/native-engine" -DORBITER_RENDERER_DEPENDENCIES="$PWD/out/ogl-dependencies" -DGLFW_BUILD_WAYLAND=OFF 2>&1 | tee native-renderer-configure.log
          cmake --build out/native-renderer --parallel 2 2>&1 | tee native-renderer-build.log
          python3 -B Tests/Production/NativeScene/module_exports.py out/native-engine/NativeModules/Graphics/OGLClient.so
      - uses: actions/cache@v6
        with:
          path: out/data-cache/production-stock-data-v1.zip
          key: production-native-data-${{ hashFiles('Tests/Production/input-storage.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Verify original data and planetary archives
        run: |
          python3 -B Tests/Production/prepare_native_data.py --archive out/data-cache/production-stock-data-v1.zip --destination out/data --group all
          python3 -B Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/planets
          python3 -B Tests/Production/NativeScene/prepare.py --delta-glider --data out/data --planets out/planets --destination out/scene-resources
      - name: Run real software-rendered native application twice against frozen Windows
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/NativeScene/verify.py --executable out/native-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-engine/NativeModules --planets out/planets --configuration ${{ matrix.configuration }} --output out/native-scene-evidence 2>&1 | tee native-scene-verification.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('out/native-scene-evidence/native-scene-report.json').read_text())
          assert all('llvmpipe' in run['renderer']['renderer'].lower() for run in report['runs']), 'Actual software renderer was not loaded'
          for directory in ('run-1','run-2'):
              numerics=json.loads((Path('out/native-scene-evidence')/directory/'numerics.json').read_text())
              assert numerics['random']=='private-msvc-lcg32' and numerics['random_maximum']==32767
              allowed=['amd-6121d02-sse2'] if '${{ matrix.math_profile }}'=='sse2' else ['amd-6121d02-fma3','amd-6121d02-sse2']
              assert numerics['math'] in allowed, 'Wrong actual CPU math profile'
          PY
      - name: Verify real instrument render targets and negative-height font glyph pixels
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Tests/Production/Cockpit/RendererProbe -B out/renderer-probe -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_ENGINE_BUILD="$PWD/out/native-engine" 2>&1 | tee native-instrument-probe-build.log
          cmake --build out/renderer-probe --parallel 2 2>&1 | tee -a native-instrument-probe-build.log
          out/renderer-probe/cockpit-sdk-layout 2>&1 | tee native-cockpit-sdk-layout.log
          out/renderer-probe/instrument-declarations 2>&1 | tee native-instrument-declarations.log
          out/renderer-probe/mfd-orbit-geometry 2>&1 | tee native-mfd-orbit-geometry.log
          out/renderer-probe/cockpit-system-clock 2>&1 | tee native-cockpit-system-clock.log
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe out/renderer-probe/renderer-probe "$PWD/out/native-engine/NativeModules/Graphics/OGLClient.so" "$PWD/out/scene-resources" "$PWD/out/planets" "$PWD/out/renderer-probe/report.json" 2>&1 | tee native-instrument-probe.log
      - name: Verify flyable stock ShuttlePB, timing, docking and persistence
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/Flight/verify.py --executable out/native-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-engine/NativeModules --planets out/planets --configuration ${{ matrix.configuration }} --output out/native-flight-evidence 2>&1 | tee native-flight-verification.log
      - name: Verify focused deletion, camera fallback, simultaneous deletion and twenty live object cycles
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/Flight/lifetime_edges.py --executable out/native-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-engine/NativeModules --planets out/planets --output out/native-lifetime-evidence 2>&1 | tee native-lifetime-verification.log
      - name: Exercise actual keyboard control and in-process reload in an owned X11 window
        id: keyboard
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/Flight/keyboard_smoke.py --lifecycle --executable out/native-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-engine/NativeModules --planets out/planets --output out/native-keyboard-evidence 2>&1 | tee native-keyboard-verification.log
      - name: Verify controlled upright takeoff and landing against the additional frozen original Windows reference
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/ControlledLanding/verify.py --executable out/native-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-engine/NativeModules --planets out/planets --configuration ${{ matrix.configuration }} --output out/native-controlled-landing 2>&1 | tee native-controlled-landing.log
      - name: Verify atmosphere, control surfaces, ground contact and actual landed persistence
        if: ${{ !cancelled() && steps.keyboard.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/GroundFlight/verify.py --executable out/native-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-engine/NativeModules --planets out/planets --configuration ${{ matrix.configuration }} --output out/native-ground-evidence 2>&1 | tee native-ground-verification.log
      - name: Build the original native glass cockpit as a separate integration candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Src/Orbiter/Production -B out/native-cockpit-engine -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=OFF -DORBITER_BUILD_NATIVE_CELESTIAL_MODULES=ON -DORBITER_BUILD_NATIVE_VESSELS=ON -DORBITER_BUILD_NATIVE_COCKPIT=ON -DORBITER_MATH_FORCE_SSE2=${{ matrix.math_profile == 'sse2' && 'ON' || 'OFF' }} -DORBITER_NATIVE_UI_ARCHIVE="$PWD/out/ogl-dependencies/imgui.zip" 2>&1 | tee native-cockpit-configure.log
          cmake --build out/native-cockpit-engine --parallel 2 2>&1 | tee native-cockpit-build.log
          cmake -S OVP/OGLClient/Native -B out/native-cockpit-renderer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_ENGINE_BUILD="$PWD/out/native-cockpit-engine" -DORBITER_RENDERER_DEPENDENCIES="$PWD/out/ogl-dependencies" -DGLFW_BUILD_WAYLAND=OFF 2>&1 | tee native-cockpit-renderer-configure.log
          cmake --build out/native-cockpit-renderer --parallel 2 2>&1 | tee native-cockpit-renderer-build.log
          python3 -B Tests/Production/NativeScene/module_exports.py out/native-cockpit-engine/NativeModules/Graphics/OGLClient.so
      - name: Verify native joystick calibration and custom function ownership
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -I Src/Orbiter Tests/Production/Boundary/NativeJoystick.Test.cpp -o out/native-joystick-test
          out/native-joystick-test
          c++ -std=c++17 -Wall -Wextra -Werror -I Src/Orbiter Tests/Production/Boundary/CustomCommands.Test.cpp -o out/native-custom-commands-test
          out/native-custom-commands-test
      - name: Build and validate original Help books and browser navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tests/Production/Help/prepare.py --destination out/scene-resources/Help --lua out/native-cockpit-engine/native-lua/lua 2>&1 | tee native-help-build.log
          python3 -B Tests/Production/Help/verify.py --help-root out/scene-resources/Help --output out/native-help-sources.json
          c++ -std=c++17 -Wall -Wextra -Werror -I Src/Orbiter Tests/Production/Help/Resolve.Test.cpp Src/Orbiter/Production/NativeHelp.cpp Src/Orbiter/Production/ResourceResolver.cpp -o out/native-help-resolver
          out/native-help-resolver out/scene-resources
          c++ -std=c++17 -Wall -Wextra -Werror -I Src/Orbiter Tests/Production/Help/Launcher.Test.cpp Src/Orbiter/Production/NativeHelp.cpp Src/Orbiter/Production/ResourceResolver.cpp -o out/native-help-launcher
          out/native-help-launcher out/native-help-launcher-evidence
          npm ci --ignore-scripts --prefix Tests/Production/Help
          echo "ORBITER_HELP_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          ORBITER_HELP_BROWSER="$(command -v google-chrome)" node Tests/Production/Help/browser.cjs --assets out/scene-resources out/native-help-browser
      - name: Generate the original Delta-glider mesh headers and verify every group ID
        shell: bash
        run: |
          set -euo pipefail
          cmake --build out/native-cockpit-engine --target native_dg_mesh_resources --parallel 2
          python3 -B Tests/Production/DeltaGlider/mesh_resources.py --headers out/native-cockpit-engine/native-dg-include --output out/dg-mesh-resources.json
      - name: Stage the original manuscript font for disposable cockpit tests
        run: python3 -B Tests/Production/CockpitUI/prepare_fonts.py --assets out/scene-resources
      - name: Exercise stock VC mesh edits and registered MFD2 drawing, input and lifetime
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/DeltaGlider/visual_mesh.py --build out/native-cockpit-engine
          --assets out/scene-resources --data out/data --planets out/planets --output out/native-dg-visual
      - name: Fly both stock DeltaGliders with the original Lua autopilot in the panel and VC
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/LuaRuntime/native_flight.py --build out/native-cockpit-engine
          --assets out/scene-resources --data out/data --planets out/planets --output out/native-lua-flight
      - name: Check synchronous commands, asynchronous worker timing, isolation and AAP controls
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/LuaRuntime/native_schedule.py --build out/native-cockpit-engine
          --assets out/scene-resources --data out/data --planets out/planets --output out/native-lua-schedule
      - name: Fly stock DG recordings, finish one naturally and release another with Ctrl+C
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/CockpitUI/recorded_flights.py --executable out/native-cockpit-engine/orbiter-production
          --modules out/native-cockpit-engine/NativeModules --assets out/scene-resources --data out/data
          --planets out/planets --output out/native-recorded-flights
      - name: Operate spacecraft selection and visible and auto-hidden cockpit info bars
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/CockpitUI/focus_bars.py --executable out/native-cockpit-engine/orbiter-production
          --modules out/native-cockpit-engine/NativeModules --assets out/scene-resources --data out/data
          --planets out/planets --output out/native-focus-bars
      - name: Verify all ten original native stock MFD modes and HUD against frozen Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tests/Production/Cockpit/frozen.py --cache out/cockpit-reference-cache --output out/frozen-cockpit
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/Cockpit/native.py --executable out/native-cockpit-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --frozen out/frozen-cockpit --configuration ${{ matrix.configuration }} --output out/native-cockpit-evidence 2>&1 | tee native-cockpit-verification.log
      - name: Verify original native RCS hit testing against frozen Windows mouse inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tests/Production/CockpitControls/frozen_controls.py --cache out/cockpit-controls-cache --output out/frozen-cockpit-controls
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/CockpitControls/native.py --executable out/native-cockpit-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --frozen out/frozen-cockpit-controls --configuration ${{ matrix.configuration }} --output out/native-cockpit-controls 2>&1 | tee native-cockpit-controls.log
      - name: Verify real GLFW mouse clicks and momentary keyboard thrust in an owned X11 cockpit
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/CockpitControls/mouse_smoke.py --executable out/native-cockpit-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --output out/native-cockpit-mouse 2>&1 | tee native-cockpit-mouse.log
      - name: Click the visible stock cockpit menu and change ship, warp, pause and save
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/CockpitUI/mouse_smoke.py --stock-menu --function-probe --help-probe --executable out/native-cockpit-engine/orbiter-production
          --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --output out/native-stock-menu
      - name: Record and replay stock vessels and commit playback editor changes
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          python3 -B Tests/Production/CockpitUI/recording.py --executable out/native-cockpit-engine/orbiter-production
          --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --output out/native-recording
      - name: Verify original selection and input dialogs against frozen Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Tests/Production/CockpitUI/frozen_ui.py --cache out/cockpit-ui-cache --output out/frozen-cockpit-ui
          python3 -B Tests/Production/additional_references.py ui-timing --cache out/cockpit-ui-timing-cache --output out/frozen-cockpit-ui-timing
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/CockpitUI/native.py --executable out/native-cockpit-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --frozen out/frozen-cockpit-ui --timing-frozen out/frozen-cockpit-ui-timing --configuration ${{ matrix.configuration }} --output out/native-cockpit-ui 2>&1 | tee native-cockpit-ui.log
      - name: Verify actual dialog typing, parameter cancellation and flight input capture
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe python3 -B Tests/Production/CockpitUI/mouse_smoke.py --executable out/native-cockpit-engine/orbiter-production --assets out/scene-resources --data out/data --modules out/native-cockpit-engine/NativeModules --planets out/planets --output out/native-cockpit-ui-window 2>&1 | tee native-cockpit-ui-window.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-production-client-${{ matrix.configuration }}-${{ matrix.math_profile }}-x64
          retention-days: 90
          path: |
            native-math-*.log
            out/native-math/math-verification.json
            out/native-math/CMakeCache.txt
            native-*.log
            out/renderer-probe/report.json
            out/native-dg-visual/*.json
            out/native-dg-visual/console.txt
            out/native-dg-visual/custom-mfd-events.txt
            out/native-dg-visual/saved.scn
            out/native-dg-visual/instrument-text.csv
            out/native-dg-visual/mfd-0-20.rgba
            out/native-engine/CMakeCache.txt
            out/native-renderer/CMakeCache.txt
            out/native-engine/native-sdk/OrbiterNativeBuild.h
            out/native-scene-evidence/**
            out/native-flight-evidence/**
            out/native-lifetime-evidence/**
            out/native-keyboard-evidence/**
            out/native-ground-evidence/**
            out/native-controlled-landing/**
            out/native-lua-schedule/lua-schedule-report.json
            out/native-lua-schedule/*/lua-events.csv
            out/native-lua-schedule/*/lua-controls.csv
            out/native-lua-schedule/*/lua-air.csv
            out/native-lua-flight/flight-report.json
            out/native-lua-flight/*/lua-flight.csv
            out/native-lua-flight/*/saved.scn
            out/native-lua-flight/*/console.txt
            out/native-lua-flight/*/graphics-lifecycle.json
            out/native-cockpit-evidence/**
            out/native-cockpit-controls/**
            out/native-cockpit-mouse/**
            out/native-cockpit-ui/**
            out/native-cockpit-ui-window/**
            out/dg-mesh-resources.json
            out/native-cockpit-engine/native-dg-include/*.h
            out/native-cockpit-engine/CMakeCache.txt
            out/native-cockpit-engine/native-sdk/OrbiterNativeBuild.h
            out/native-cockpit-renderer/CMakeCache.txt
            out/scene-resources/resources.json
            out/scene-resources/cockpit-test-font.json
            out/native-engine/NativeModules/Graphics/Licenses/**

      - name: Archive spacecraft observation samples for the paired comparison
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spacecraft-native-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: |
            out/native-recorded-flights/recorded-flights.json
            out/native-recorded-flights/*/numerics.json
            out/native-recorded-flights/*/playback-state.csv
            out/native-recorded-flights/*/instrument-*.rgba
            out/native-recorded-flights/*/console.txt
            out/native-recording/verification.json
            out/native-recording/initial.scn
            out/native-recording/*/invocation.json
            out/native-recording/*/Orbiter.cfg
            out/native-recording/*/replay.csv
            out/native-recording/*/console.log
            out/native-recording/*/playback-state.csv
            out/native-recording/*/graphics-lifecycle.json
            out/native-recording/*/Playback/*.scn
            out/native-recording/*/Flights/*/*
            out/native-stock-menu/menu-verification.json
            out/native-stock-menu/help-verification.json
            out/native-stock-menu/help-notification.png
            out/native-stock-menu/help/**
            out/native-help-browser/**
            out/native-help-sources.json
            out/scene-resources/Help/manifest.json
            native-help-build.log
            out/native-stock-menu/custom-function-events.txt
            out/native-stock-menu/menu-windows.csv
            out/native-stock-menu/options-state.csv
            out/native-stock-menu/Orbiter.cfg
            out/native-stock-menu/options-reloaded/*.csv
            out/native-stock-menu/options-reloaded/console.log
            out/native-stock-menu/control-inputs.csv
            out/native-stock-menu/console.log
            out/native-stock-menu/numerics.json
            out/native-stock-menu/graphics-lifecycle.json
            out/native-stock-menu/Quicksave/*.scn
            out/native-stock-menu/ScriptFiles/config/*.cfg
            out/native-focus-bars/focus-bars-report.json
            out/native-focus-bars/options/Orbiter.cfg
            out/native-focus-bars/function/custom-function-events.txt
            out/native-focus-bars/recorder/Flights/**/*
            out/native-focus-bars/recorder/Playback/*.scn
            out/native-focus-bars/*/numerics.json
            out/native-focus-bars/*/cockpit-state.csv
            out/native-focus-bars/*/instrument-*.rgba

  original_spacecraft:
    name: Preserved Windows spacecraft observations ${{ matrix.configuration }} ${{ matrix.math_profile }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/cache@v6
        with:
          path: out/cockpit-cache
          key: original-cockpit-control-runtime-${{ matrix.configuration }}-${{ hashFiles('Tests/Production/Cockpit/Reference/provenance.json') }}
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify and stage stock data and software renderer
        shell: pwsh
        run: |
          python -B Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/stage_mesa.py stage --cache out/mesa-cache --destination out/mesa-runtime
          exit $LASTEXITCODE
      - name: Stage the preserved Windows cockpit app and build its SDK observer
        id: preserved_cockpit
        shell: pwsh
        run: |
          python -B Tests/Production/CockpitControls/prepare.py --configuration ${{ matrix.configuration }} --cache out/cockpit-cache --output out/focus-original
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S Tests/Production/RecordedFlight -B out/focus-driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/focus-original"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/focus-driver --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select the matching CRT profile for SSE2 observations
        if: matrix.math_profile == 'sse2'
        shell: pwsh
        run: '"ORBITER_TEST_OBSERVER_SSE2=1" >> $env:GITHUB_ENV'
      - name: Observe spacecraft selection and info bars in the preserved original Windows app
        run: >-
          python -B Tests/Production/CockpitUI/focus_bars.py --original --executable out/focus-original/Orbiter.exe
          --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime --output out/focus-bars-original
      - name: Fly unchanged Delta-glider recordings on the preserved original Windows application
        if: ${{ !cancelled() && steps.preserved_cockpit.outcome == 'success' }}
        run: >-
          python -B Tests/Production/CockpitUI/recorded_flights.py --original --executable out/focus-original/Orbiter.exe
          --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime --output out/original-recorded-flights
      - name: Archive original spacecraft observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spacecraft-original-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: |
            out/focus-bars-original/general-api/general-api-result.json
            out/focus-bars-original/general-api/Orbiter.log
            out/focus-bars-original/*/math-profile.txt
            out/original-recorded-flights/*/math-profile.txt
            out/focus-bars-original/*/earth-obliquity.txt
            out/original-recorded-flights/recorded-flights.json
            out/original-recorded-flights/*/playback-state.csv
            out/original-recorded-flights/*/instrument-*.rgba
            out/original-recorded-flights/*/cockpit-failure.txt
            out/original-recorded-flights/*/console.txt
            out/focus-bars-original/focus-bars-report.json
            out/focus-bars-original/*/cockpit-state.csv
            out/focus-bars-original/*/instrument-*.rgba
            out/focus-bars-original/*/cockpit-failure.txt
            out/focus-bars-original/*/console.txt
            out/focus-bars-original/*/Orbiter.log
            out/focus-bars-original/*/ui-inputs.csv
            out/focus-bars-original/options/Orbiter.cfg
            out/focus-bars-original/function/custom-function-events.txt
            out/focus-bars-original/recorder/Flights/test_record/*
            out/focus-bars-original/recorder/Scenarios/Playback/*.scn
            out/focus-original/control-reference-runtime.json

  compare_spacecraft:
    name: Compare native and original spacecraft ${{ matrix.configuration }} ${{ matrix.math_profile }}
    needs: [native, original_spacecraft]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: spacecraft-original-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: original
      - uses: actions/download-artifact@v8
        with:
          name: spacecraft-native-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: native
      - name: Compare recorded flight trajectories, controls, camera cuts and complete frames
        run: >-
          python3 -B Tests/Production/CockpitUI/recorded_flights.py compare --original original/original-recorded-flights
          --native native/native-recorded-flights --output recorded-comparison.json
      - name: Compare focus selection, time and target bars
        if: ${{ !cancelled() }}
        run: >-
          python3 -B Tests/Production/CockpitUI/focus_bars.py compare --original original/focus-bars-original
          --native native/native-focus-bars --output focus-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spacecraft-comparison-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: '*-comparison.json'
