  original_spacecraft:
    name: Preserved Windows spacecraft observations ${{ matrix.configuration }} ${{ matrix.math_profile }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/cache@v6
        with:
          path: out/cockpit-cache
          key: original-cockpit-control-runtime-${{ matrix.configuration }}-${{ hashFiles('Tests/Production/Cockpit/Reference/provenance.json') }}
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify and stage stock data and software renderer
        shell: pwsh
        run: |
          python -B Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/stage_mesa.py stage --cache out/mesa-cache --destination out/mesa-runtime
          exit $LASTEXITCODE
      - name: Stage the preserved Windows cockpit app and build its SDK observer
        id: preserved_cockpit
        shell: pwsh
        run: |
          python -B Tests/Production/CockpitControls/prepare.py --configuration ${{ matrix.configuration }} --cache out/cockpit-cache --output out/focus-original
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S Tests/Production/RecordedFlight -B out/focus-driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/focus-original"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/focus-driver --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select the matching CRT profile for SSE2 observations
        if: matrix.math_profile == 'sse2'
        shell: pwsh
        run: '"ORBITER_TEST_OBSERVER_SSE2=1" >> $env:GITHUB_ENV'
      - name: Observe spacecraft selection and info bars in the preserved original Windows app
        run: >-
          python -B Tests/Production/CockpitUI/focus_bars.py --original --executable out/focus-original/Orbiter.exe
          --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime --output out/focus-bars-original
      - name: Fly unchanged Delta-glider recordings on the preserved original Windows application
        if: ${{ !cancelled() && steps.preserved_cockpit.outcome == 'success' }}
        run: >-
          python -B Tests/Production/CockpitUI/recorded_flights.py --original --executable out/focus-original/Orbiter.exe
          --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime --output out/original-recorded-flights
      - name: Build the DG systems observer against the preserved original SDK
        id: systems_observer
        if: ${{ !cancelled() && steps.preserved_cockpit.outcome == 'success' }}
        shell: pwsh
        run: |
          cmake -S Tests/Production/DeltaGlider/SystemsObserver -B out/systems-observer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/focus-original"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/systems-observer --parallel 2
          exit $LASTEXITCODE
      - name: Operate and reload DG systems in the preserved original Windows application
        if: ${{ !cancelled() && steps.systems_observer.outcome == 'success' }}
        run: >-
          python -B Tests/Production/DeltaGlider/systems.py --original --executable out/focus-original/Orbiter.exe
          --data out/production-data --planets out/standard-planets --mesa out/mesa-runtime --output out/original-dg-systems
      - name: Build the VC camera observer against the preserved original SDK
        id: camera_observer
        if: ${{ !cancelled() && steps.preserved_cockpit.outcome == 'success' }}
        shell: pwsh
        run: |
          cmake -S Tests/Production/CockpitCamera -B out/camera-observer -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/focus-original"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/camera-observer --parallel 2
          exit $LASTEXITCODE
      - name: Capture original forward and turned VC views with scenario and reopened MFDs
        if: ${{ !cancelled() && steps.camera_observer.outcome == 'success' }}
        run: >-
          python -B Tests/Production/CockpitCamera/run.py capture --original
          --executable out/focus-original/Orbiter.exe --data out/production-data
          --planets out/standard-planets --mesa out/mesa-runtime
          --configuration ${{ matrix.configuration }} --math-profile ${{ matrix.math_profile }}
          --output out/original-cockpit-camera
      - name: Archive original spacecraft observations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spacecraft-original-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: |
            out/original-cockpit-camera/camera-report.json
            out/original-cockpit-camera/*/*.csv
            out/original-cockpit-camera/*/*.rgba
            out/original-cockpit-camera/*/*.png
            out/original-cockpit-camera/*/*.json
            out/original-cockpit-camera/*/headlook.txt
            out/original-cockpit-camera/*/console.txt
            out/original-cockpit-camera/*/Orbiter.log
            out/original-cockpit-camera/*/cockpit-*.txt
            out/original-cockpit-camera/*/math-profile.txt
            out/original-cockpit-camera/*/renderer-modules.txt
            out/original-cockpit-camera/*/Scenarios/Behavior.scn
            out/original-dg-systems/systems-report.json
            out/original-dg-systems/*/*/flight.scn
            out/original-dg-systems/*/*/saved.scn
            out/original-dg-systems/*/*/systems-case.txt
            out/original-dg-systems/*/*/system-inputs.csv
            out/original-dg-systems/*/*/flight-animations.csv
            out/original-dg-systems/*/*/cockpit-state.csv
            out/original-dg-systems/*/*/console.log
            out/original-dg-systems/*/*/console.txt
            out/original-dg-systems/*/*/Orbiter.log
            out/original-dg-systems/*/*/graphics-lifecycle.json
            out/original-dg-systems/*/*/graphics-errors.txt
            out/original-dg-systems/*/*/numerics.json
            out/original-dg-systems/*/*/math-profile.txt
            out/original-dg-systems/*/*/invocation.json
            out/original-dg-systems/*/*/cockpit-failure.txt
            out/original-dg-systems/*/*/cockpit-complete.txt
            out/original-dg-systems/*/*/renderer-info.json
            out/original-dg-systems/*/*/renderer-modules.txt
            out/original-dg-systems/*/*/mesa-bindings.json
            out/focus-bars-original/general-api/general-api-result.json
            out/focus-bars-original/general-api/Orbiter.log
            out/focus-bars-original/*/math-profile.txt
            out/original-recorded-flights/*/math-profile.txt
            out/focus-bars-original/*/earth-obliquity.txt
            out/original-recorded-flights/recorded-flights.json
            out/original-recorded-flights/*/playback-state.csv
            out/original-recorded-flights/*/instrument-*.rgba
            out/original-recorded-flights/*/cockpit-failure.txt
            out/original-recorded-flights/*/console.txt
            out/focus-bars-original/focus-bars-report.json
            out/focus-bars-original/*/cockpit-state.csv
            out/focus-bars-original/*/instrument-*.rgba
            out/focus-bars-original/*/cockpit-failure.txt
            out/focus-bars-original/*/console.txt
            out/focus-bars-original/*/Orbiter.log
            out/focus-bars-original/*/ui-inputs.csv
            out/focus-bars-original/options/Orbiter.cfg
            out/focus-bars-original/function/custom-function-events.txt
            out/focus-bars-original/recorder/Flights/test_record/*
            out/focus-bars-original/recorder/Scenarios/Playback/*.scn
            out/focus-original/control-reference-runtime.json

  compare_spacecraft:
    name: Compare native and original spacecraft ${{ matrix.configuration }} ${{ matrix.math_profile }}
    needs: [native, original_spacecraft]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: spacecraft-original-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: original
      - uses: actions/download-artifact@v8
        with:
          name: spacecraft-native-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: native
      - name: Compare recorded flight trajectories, controls, camera cuts and complete frames
        run: >-
          python3 -B Tests/Production/CockpitUI/recorded_flights.py compare --original original/original-recorded-flights
          --native native/native-recorded-flights --output recorded-comparison.json
      - name: Compare focus selection, time and target bars
        if: ${{ !cancelled() }}
        run: >-
          python3 -B Tests/Production/CockpitUI/focus_bars.py compare --original original/focus-bars-original
          --native native/native-focus-bars --output focus-comparison.json
      - name: Compare original and native DG systems, animations and save/reload trajectories
        if: ${{ !cancelled() }}
        run: >-
          python3 -B Tests/Production/DeltaGlider/systems.py compare --original original/original-dg-systems
          --native native/native-dg-systems --output dg-systems-comparison.json
      - name: Compare actual VC camera transforms, MFD surfaces and complete off-axis frames
        if: ${{ !cancelled() }}
        run: >-
          python3 -B Tests/Production/CockpitCamera/run.py compare
          --original original/original-cockpit-camera --native native/native-cockpit-camera
          --output camera-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spacecraft-comparison-${{ matrix.configuration }}-${{ matrix.math_profile }}
          path: '*-comparison.json'

  compare_shuttle_a:
    name: Compare original and native Shuttle-A ${{ matrix.configuration }} ${{ matrix.math_profile }}
    needs: [native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: out/shuttle-a-original-cache/*.zip
          key: shuttle-a-original-${{ hashFiles('Tests/Production/ShuttleA/observations.lock.json') }}
      - uses: actions/download-artifact@v8
        with:
          name: native-production-client-${{ matrix.configuration }}-${{ matrix.math_profile }}-x64
          path: runtime
      - name: Verify and audit the pinned original Windows observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B Tests/Production/ShuttleA/frozen_original.py
          --cache out/shuttle-a-original-cache --output out/shuttle-a-original
          --audit out/shuttle-a-original-audit.json
      - name: Compare every vessel, docking port, camera and full framebuffer
        run: >-
          python3 -B Tests/Production/StockVessels/compare.py --suite shuttle-a
          --original out/shuttle-a-original/${{ matrix.configuration }}-${{ matrix.math_profile }}/shuttle-a-original
          --native runtime/out/native-shuttle-a --runtime-root runtime
          --reference-audit out/shuttle-a-original-audit.json --output shuttle-a-comparison.json
      - name: Verify the pinned original Windows controls and persistence observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B Tests/Production/ShuttleA/Controls/frozen_original.py
          --cache out/shuttle-a-controls-cache --output out/shuttle-a-controls-original
          --audit out/shuttle-a-controls-original-audit.json
      - name: Compare Shuttle-A controls, saved mechanisms and every vessel in the complete scene
        run: >-
          python3 -B Tests/Production/ShuttleA/Controls/compare.py
          --original out/shuttle-a-controls-original/${{ matrix.configuration }}-${{ matrix.math_profile }}/shuttle-a-controls-original
          --native runtime/out/native-shuttle-a-controls --runtime-root runtime/out/native-cockpit-engine
          --reference-audit out/shuttle-a-controls-original-audit.json --output shuttle-a-controls-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shuttle-a-comparison-${{ matrix.configuration }}-${{ matrix.math_profile }}
          retention-days: 90
          path: |
            shuttle-a-comparison.json
            out/shuttle-a-original-audit.json
            out/shuttle-a-original/downloads.json
            shuttle-a-controls-comparison.json
            out/shuttle-a-controls-original-audit.json
            out/shuttle-a-controls-original/downloads.json
