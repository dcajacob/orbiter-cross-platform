name: Phase 6 Read Only Original SDK Header Restoration
on:
  push:
    branches: ['qualification/rejection-sdk-inspection-v2']
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-rejection-sdk-inspection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve all original controls before read only inspection
        run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/rejection-sdk-inspection-controls.json
      - name: Retain only exact original Debug sse2 binary witness bytes
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo;
            if(owner!=='dcajacob'||repo!=='orbiter-cross-platform'||(await github.rest.repos.get({owner,repo})).data.private)throw Error('Exact public repository required');
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:42519601899})).data;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:42519601899,per_page:100});
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:13633311229})).data;
            const base='out/rejection-sdk-inspection-input';fs.mkdirSync(base,{recursive:true});
            fs.writeFileSync(base+'/api.json',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2),{flag:'wx'});
            if(run.id!==42519601899||run.head_sha!=='ccc02c8a34bd1f227624d8778a141e8736ae8111'||run.run_attempt!==1||run.status!=='completed'||run.conclusion!=='failure'||artifact.id!==13633311229||artifact.name!=='phase6-full-native-Debug-sse2'||artifact.expired||artifact.size_in_bytes!==82507652||artifact.digest!=='sha256:11f150fffd8b02bf6f9d438a4aff9b37a203c2d9db4eea8ae2905ff078d2898f')throw Error('Exact original preserved compiled source required');
            require('./.github/scripts/phase6-download-native-api-inputs.cjs').validateJobs('native',run,jobs);
            const bytes=Buffer.from((await require('./.github/scripts/phase6-download-bound-artifact.cjs')({github,owner,repo,source:{run,jobs},artifact,base,core})).data);
            if(bytes.length!==82507652||crypto.createHash('sha256').update(bytes).digest('hex')!=='11f150fffd8b02bf6f9d438a4aff9b37a203c2d9db4eea8ae2905ff078d2898f')throw Error('Exact original binary witness archive bytes differ');
            fs.writeFileSync(base+'/producer.zip',bytes,{flag:'wx'});
      - name: Read every SDK witness and inspect ELF exports without running or loading any binary
        run: >-
          python3 -B Tests/Production/Closeout/inspect_rejection_sdk_header_restoration.py
          --api out/rejection-sdk-inspection-input/api.json
          --archive out/rejection-sdk-inspection-input/producer.zip
          --output out/rejection-sdk-inspection
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-rejection-SDK-read-only-restoration
          retention-days: 14
          path: |
            out/rejection-sdk-inspection-controls.json
            out/rejection-sdk-inspection/**/*.json
            out/rejection-sdk-inspection-input/api.json
            out/rejection-sdk-inspection-input/*.body
            out/rejection-sdk-inspection-input/download-transport-attempts.json
