name: Phase6 Independent Original Assembly Contact Trial Audit
'on':
  push:
    branches:
    - qualification/assembly-contact-independent-v2
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-assembly-contact-independent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Bind exact completed trial and preserved original failed bytes
      uses: actions/github-script@v8
      with:
        script: 'const fs=require(''fs''),crypto=require(''crypto''),{owner,repo}=context.repo;

          const run_id=42964822330,source=''fb619df9b44550d2797cab0b92b602813f5e5319'',base=''out/contact-component-independent'';

          const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;

          const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id,per_page:100})).data.jobs;

          if(owner!==''dcajacob''||repo!==''orbiter-cross-platform''||run.repository.private||run.repository.full_name!==owner+''/''+repo||run.head_sha!==source||run.head_branch!==''qualification/assembly-contact-component-v3''||run.run_attempt!==1||run.status!==''completed''||![''success'',''failure''].includes(run.conclusion)||jobs.length!==1||jobs[0].name!==''trial''||jobs[0].head_sha!==source||jobs[0].status!==''completed''||jobs[0].conclusion!==run.conclusion||jobs[0].labels.join('','')!==''ubuntu-24.04'')throw
          Error(''Exact completed standard source trial required; preserve failed
          outcome'');

          const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id,per_page:100})).data.artifacts;

          const matches=artifacts.filter(a=>a.name===''assembly-contact-component-trial-raw''&&!a.expired&&a.workflow_run.id===run_id&&a.workflow_run.head_sha===source);

          if(matches.length!==1)throw Error(''One complete original raw trial artifact
          required'');

          fs.mkdirSync(base,{recursive:true});const artifact=matches[0],record={run,jobs,artifact};fs.writeFileSync(base+''/api.json'',JSON.stringify(record,null,2),{flag:''wx''});

          const downloaded=await require(''./.github/scripts/phase6-download-bound-artifact.cjs'')({github,owner,repo,source:record,artifact,base,core});const
          bytes=Buffer.from(downloaded.data);

          if(bytes.length!==artifact.size_in_bytes||''sha256:''+crypto.createHash(''sha256'').update(bytes).digest(''hex'')!==artifact.digest)throw
          Error(''Exact original trial API size/SHA differs'');

          fs.writeFileSync(base+''/producer.zip'',bytes,{flag:''wx''});

          const priorRun=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:42955135432})).data;

          const priorJobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:priorRun.id,per_page:100})).data.jobs;

          const priorArtifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:13827115523})).data;

          if(priorRun.head_sha!==''619243950ed5ada4e0f4a2b901229384ed395f3f''||priorRun.run_attempt!==1||priorRun.status!==''completed''||priorRun.conclusion!==''success''||priorJobs.length!==4||priorJobs.some(j=>j.status!==''completed''||j.conclusion!==''success''||j.head_sha!==priorRun.head_sha||j.labels.join('','')!==''ubuntu-24.04'')||priorArtifact.expired||priorArtifact.name!==''failed-normal-diagnostic-Debug-automatic''||priorArtifact.workflow_run.id!==priorRun.id||priorArtifact.workflow_run.head_sha!==priorRun.head_sha||priorArtifact.size_in_bytes!==324434||priorArtifact.digest!==''sha256:18da8a441c1ed94248650f858a89b6836613240c4edc8516f2e24142b945cc0d'')throw
          Error(''Exact independently inspected original failed trace source required'');

          const priorRecord={run:priorRun,jobs:priorJobs,artifact:priorArtifact};fs.writeFileSync(base+''/prior-api.json'',JSON.stringify(priorRecord,null,2),{flag:''wx''});

          const priorBase=base+''/prior-transport'';fs.mkdirSync(priorBase,{recursive:true});

          const response=await require(''./.github/scripts/phase6-download-bound-artifact.cjs'')({github,owner,repo,source:priorRecord,artifact:priorArtifact,base:priorBase,core});const
          prior=Buffer.from(response.data);

          if(prior.length!==priorArtifact.size_in_bytes||''sha256:''+crypto.createHash(''sha256'').update(prior).digest(''hex'')!==priorArtifact.digest)throw
          Error(''Original failure diagnostic API size/SHA differs'');

          fs.writeFileSync(base+''/prior.zip'',prior,{flag:''wx''});

          '
    - name: Replay unchanged original readers and independently check every tick and
        vessel
      shell: bash
      run: 'set -euo pipefail

        python3 -B Tests/Production/Closeout/run_controls.py --output out/contact-independent-controls.json

        python3 -B Tests/Production/Closeout/audit_contact_component_trial.py

        '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: independent-assembly-contact-trial
        retention-days: 14
        if-no-files-found: error
        path: 'out/contact-component-independent/*.json

          out/contact-independent-controls.json

          out/contact-component-independent/prior-transport/*

          '
