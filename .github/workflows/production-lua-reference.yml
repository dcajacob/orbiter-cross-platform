name: Original Windows Lua and AAP Reference
on:
  push:
    branches: ['codex/production-**']
    paths:
      - 'Tests/Production/LuaRuntime/**'
      - '.github/actions/capture-original-lua/**'
      - '.github/workflows/production-lua-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-lua-aap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    name: Original Lua and AAP Debug and Release on the same Windows host
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Prepare verified unchanged stock data
        shell: pwsh
        run: |
          python -B Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/planets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -B Tests/Production/stage_mesa.py stage --cache out/mesa-cache --destination out/mesa
      - name: Observe stock Lua and AAP in Debug
        uses: ./.github/actions/capture-original-lua
        with:
          configuration: Debug
      - name: Observe stock Lua and AAP in Release
        if: ${{ !cancelled() }}
        uses: ./.github/actions/capture-original-lua
        with:
          configuration: Release
  compare:
    name: Original Lua and AAP Debug/Release parity
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: original-lua-aap-Debug
          path: out/debug
      - uses: actions/download-artifact@v8
        with:
          name: original-lua-aap-Release
          path: out/release
      - run: >-
          python3 -B Tests/Production/LuaRuntime/compare_lua.py --debug out/debug/out/control-reference
          --release out/release/out/control-reference --output cockpit-control-comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-lua-aap-comparison
          path: cockpit-control-comparison.json
