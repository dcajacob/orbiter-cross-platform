name: Original Windows Ground Math Observation

on:
  push:
    branches: ['codex/production-**']
    paths: ['Src/Orbiter/Production/MathObservation.h', 'Src/Orbiter/Production/ContactObservation.h', 'Tests/Production/GroundFlight/MathObserve.cpp', 'Tests/Production/GroundFlight/MathDispatch.cpp', 'Tests/Production/GroundFlight/diagnose.py', '.github/workflows/production-ground-math.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  behavior:
    name: Original Windows math ${{ matrix.variant }} ${{ matrix.configuration }} x64
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]
        variant: [observation, fma-disabled]
    env:
      DXSDK_DIR: '${{ github.workspace }}\DXSDK'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - uses: actions/cache@v6
        id: dxsdk
        with:
          path: '${{ github.workspace }}\DXSDK'
          key: dxsdk_jun10
      - name: Prepare existing SDK dependency
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl --fail -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o DXSDK_Jun10.exe
          if errorlevel 1 exit /b 1
          7z x DXSDK_Jun10.exe DXSDK/Include DXSDK/Lib
          if errorlevel 1 exit /b 1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41342204437
          name: production-runtime-${{ matrix.configuration }}-x64
          path: out/runtime-archive
      - uses: actions/checkout@v7
        with:
          ref: 391919027ac3e4a4d42f145373c788fc859c32cd
          path: out/frozen-source
      - name: Verify the pre-flight application and SDK byte-for-byte
        shell: pwsh
        run: |
          Expand-Archive out/runtime-archive/windows-test-runtime.zip out/production-app
          $runtime = "$pwd/out/production-app"
          Push-Location out/frozen-source
          python Tests/Production/verify_test_runtime.py --runtime "$runtime" --source 391919027ac3e4a4d42f145373c788fc859c32cd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Compile the current controls/observation driver against that build
        shell: pwsh
        run: |
          cmake -S Tests/Production/BehaviorBuild -B out/driver -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_TEST_RUNTIME="$pwd/out/production-app" -DORBITER_FROZEN_SOURCE="$pwd/out/frozen-source" 2>&1 | Tee-Object out/ground-driver-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/driver --parallel 2 2>&1 | Tee-Object out/ground-driver-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Prepare locked physics and terrain data
        run: |
          python Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip --destination out/production-data
          python Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
      - name: Observe original math or run the separately identified runtime sensitivity experiment
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ matrix.variant }}' -eq 'fma-disabled') { $extra = @('--disable-fma3') }
          python Tests/Production/GroundFlight/diagnose.py --orbiter out/production-app/Orbiter.exe --data out/production-data --planets out/standard-planets --output out/production-math --configuration ${{ matrix.configuration }} @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ground-math-${{ matrix.configuration }}-${{ matrix.variant }}
          path: |
            out/ground-driver-*.log
            out/driver/CMakeCache.txt
            out/production-app/test-runtime.json
            out/production-math/**/*.csv
            out/production-math/**/*.json
            out/production-math/**/*.txt
            out/production-math/**/*.log
            out/production-math/**/*.scn
            out/production-math/**/Orbiter.cfg
