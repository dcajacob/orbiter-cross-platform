name: Phase6 Diagnose New Physics v2 HST Launch Regression
'on':
  push:
    branches:
    - qualification/physics-v2-HST-diagnostics-v1
    - qualification/physics-v2-HST-reader-v2
permissions:
  contents: read
  actions: read
jobs:
  native_raw:
    name: Inspect actual HST raw ${{ matrix.cohort }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cohort: ${{ fromJSON(github.ref_name == 'qualification/physics-v2-HST-reader-v2' && '["new"]' || '["original","new"]') }}
    env:
      COHORT: ${{ matrix.cohort }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Retain exact actual original-passed or new-failed raw source cohort
      uses: actions/github-script@v8
      with:
        script: 'const fs=require(''fs''),crypto=require(''crypto''),{owner,repo}=context.repo,cohort=process.env.COHORT;

          const p=cohort===''original''?[42926670117,''2cf4163dd55cab88337bcdf5890a4a34c1b3334b'',13821827788,280560690,''ffec46a812b67cb81406c567ee730fe53d90b4f6ac2c3511087785d7e531e7ec'',130215319343]:[43075337730,''f67250f90a18579343fa4d5bf7c03a1a3e980bdf'',13886122449,280823270,''6b82fb6ba67b68bd8cda40741effada85fc3fa1f4d7a70c12a890c3b4b8e64da'',130713561371];

          const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:p[0]})).data;

          const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:p[0],per_page:100});

          const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:p[2]})).data;

          const selected=jobs.filter(j=>j.id===p[5]);

          if(owner!==''dcajacob''||repo!==''orbiter-cross-platform''||run.head_sha!==p[1]||run.run_attempt!==1||run.repository.private||selected.length!==1||selected[0].status!==''completed''||selected[0].conclusion!==''failure''||selected[0].head_sha!==p[1]||selected[0].labels.join('','')!==''ubuntu-24.04''||artifact.expired||artifact.size_in_bytes!==p[3]||artifact.digest!==''sha256:''+p[4]||artifact.workflow_run.id!==p[0]||artifact.workflow_run.head_sha!==p[1])throw
          Error(''Actual original failed cohort and exact full raw bytes required'');

          const base=''out/physics-v2-HST-source/''+cohort;fs.mkdirSync(base,{recursive:true});const source={run,jobs,artifact};fs.writeFileSync(base+''/api.json'',JSON.stringify(source,null,2),{flag:''wx''});

          const bytes=Buffer.from((await require(''./.github/scripts/phase6-download-bound-artifact.cjs'')({github,owner,repo,source,artifact,base,core})).data);

          if(bytes.length!==p[3]||crypto.createHash(''sha256'').update(bytes).digest(''hex'')!==p[4])throw Error(''Exact original archive bytes required'');fs.writeFileSync(base+''/producer.zip'',bytes,{flag:''wx''});

          '
    - name: Independently read full raw closure and actual HST finite-state history without simulation
      run: python3 -B Tests/Production/PhysicsV2/inspect_hst.py
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: physics-v2-HST-${{ matrix.cohort }}-independent
        retention-days: 14
        path: 'out/physics-v2-HST-inspection/${{ matrix.cohort }}/verification.json

          out/physics-v2-HST-inspection/${{ matrix.cohort }}/actual-HST-output/**

          out/physics-v2-HST-source/${{ matrix.cohort }}/api.json'
  windows:
    if: github.ref_name == 'qualification/physics-v2-HST-diagnostics-v1'
    name: HST new physics Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        configuration:
        - Debug
        - Release
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      ORBITER_DATA_CONTAINER_LOCK: application-source/Tests/Production/stock-data-container-v2.lock.json
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Retain the separate immutable current application source owner
      uses: actions/checkout@v7
      with:
        ref: f72ffb4d684bf25217e71400771bb7ec24a5715c
        path: application-source
        fetch-depth: 0
    - name: Retain actual source-bound rebuilt Windows v2 SDK
      uses: actions/github-script@v8
      with:
        script: await require('./Tests/Production/PhysicsV2/download.cjs')({github,context,core,role:'windows',profile:process.env.CONFIGURATION});
    - name: Independently verify all original SDK and28unit guards against new compiled source
      run: python -B Tests/Production/PhysicsV2/restore.py windows ${{ matrix.configuration }}
    - name: Verify exact rebuilt application and separate SDK owner
      working-directory: application-source
      run: python -B Tests/Production/verify_test_runtime.py --runtime ../out/current-windows-sdk/runtime --source f72ffb4d684bf25217e71400771bb7ec24a5715c
    - name: Restore unchanged stock data and planetary inputs
      run: python -B Tests/Production/PhysicsV2/windows_data.py --cell ${{ matrix.configuration }}-automatic-stock
    - name: Restore unchanged original software renderer DLLs and notices
      run: python -B application-source/Tests/Production/stage_mesa.py stage --cache out/current-mesa-cache --destination out/current-stock-mesa
    - name: Diagnose unchanged HST Launch both math modes at original60frames andpoint25seconds
      run: python -B Tests/Production/PhysicsV2/windows_hst.py
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: physics-v2-HST-Windows-${{ matrix.configuration }}-raw
        retention-days: 14
        compression-level: 0
        path: 'out/physics-v2-HST-Windows/${{ matrix.configuration }}/*.tar.gz

          out/physics-v2-HST-Windows/${{ matrix.configuration }}/*.json

          out/physics-v2-HST-Windows/${{ matrix.configuration }}/*.log

          out/current-windows-sdk/restoration.json

          out/physics-v2-input/windows/${{ matrix.configuration }}/api.json

          out/current-data-transport/**

          '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: physics-v2-HST-Windows-${{ matrix.configuration }}-receipt
        retention-days: 14
        path: 'out/physics-v2-HST-Windows/${{ matrix.configuration }}/collection.json

          out/physics-v2-HST-Windows/${{ matrix.configuration }}/independent-scene-inspection.json

          out/physics-v2-HST-Windows/${{ matrix.configuration }}/diagnostic-raw-index.json

          out/physics-v2-HST-Windows/${{ matrix.configuration }}/*/process-receipt.json

          out/physics-v2-HST-Windows/${{ matrix.configuration }}/*/stock-vessel-complete.txt

          '
