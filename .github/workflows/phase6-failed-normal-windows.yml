name: Phase6 Current Windows Matched Failed Normal Diagnostics
'on':
  push:
    branches:
    - qualification/failed-normal-windows-v2
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-failed-normal-windows
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        configuration:
        - Debug
        - Release
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      ORBITER_DATA_CONTAINER_LOCK: application-source/Tests/Production/stock-data-container-v2.lock.json
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Retain the separate immutable current application source owner
      uses: actions/checkout@v7
      with:
        ref: c08f93151827949ee3ad498f8021f35c11753fde
        path: application-source
        fetch-depth: 0
    - name: Download only the exact successful current SDK from its actual API producer
      uses: actions/github-script@v8
      with:
        script: 'const fs = require(''fs'');

          const crypto = require(''crypto'');

          const {owner,repo} = context.repo;

          const run_id = 42525562745;

          const producer = ''c08f93151827949ee3ad498f8021f35c11753fde'';

          const configuration = process.env.CONFIGURATION;

          const ids = {Debug:13636121355,Release:13635896646};

          if (owner !== ''dcajacob'' || repo !== ''orbiter-cross-platform'' || !ids[configuration]) throw Error(''Exact authorized SDK profile required'');

          const run = (await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;

          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100});

          const artifact = (await github.rest.actions.getArtifact({owner,repo,artifact_id:ids[configuration]})).data;

          if (run.head_sha !== producer || run.status !== ''completed'' || run.conclusion !== ''success'' || artifact.expired || artifact.workflow_run.id !== run_id
          || artifact.workflow_run.head_sha !== producer) throw Error(''Closed successful source-bound SDK required'');

          const downloaded = await github.rest.actions.downloadArtifact({owner,repo,artifact_id:artifact.id,archive_format:''zip''});

          const bytes = Buffer.from(downloaded.data);

          if (''sha256:''+crypto.createHash(''sha256'').update(bytes).digest(''hex'') !== artifact.digest || bytes.length !== artifact.size_in_bytes) throw Error(''Actual
          SDK API archive digest/length differs'');

          fs.mkdirSync(''out/current-sdk-source'',{recursive:true});

          fs.writeFileSync(''out/current-sdk-source/producer.zip'',bytes);

          fs.writeFileSync(''out/current-sdk-source/api.json'',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2));

          '
    - name: Restore every exact SDK member and independently re-read all original source and unit receipts
      run: python -B Tests/Production/CurrentWindows/Hosted/restore_sdk.py --api out/current-sdk-source/api.json --archive out/current-sdk-source/producer.zip --configuration
        ${{ matrix.configuration }} --source-owner application-source --output out/current-windows-sdk
    - name: Verify the same immutable application and SDK from their separate source checkout
      working-directory: application-source
      run: python -B Tests/Production/verify_test_runtime.py --runtime ../out/current-windows-sdk/runtime --source c08f93151827949ee3ad498f8021f35c11753fde
    - name: Stage every original current-stock data file and planetary input
      run: python -B Tests/Production/CurrentWindows/Hosted/prepare_current_data_retry.py --cell ${{ matrix.configuration }}-automatic-stock
    - name: Stage the exact original software renderer DLLs and notices
      run: python -B application-source/Tests/Production/stage_mesa.py stage --cache out/current-mesa-cache --destination out/current-stock-mesa
    - name: Run the four unchanged failed scenes at60frames and0.25seconds using the exact unedited passive observer
      run: python -B Tests/Production/Closeout/capture_failed_normal_windows.py
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: failed-normal-Windows-${{ matrix.configuration }}-raw
        retention-days: 14
        compression-level: 0
        path: 'out/failed-normal-Windows/${{ matrix.configuration }}/*.tar.gz

          out/failed-normal-Windows/${{ matrix.configuration }}/*.json

          out/failed-normal-Windows/${{ matrix.configuration }}/*.log

          out/current-windows-sdk/restoration.json

          out/current-sdk-source/api.json

          out/current-data-transport/

          '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: failed-normal-Windows-${{ matrix.configuration }}-receipt
        retention-days: 14
        if-no-files-found: error
        path: 'out/failed-normal-Windows/${{ matrix.configuration }}/collection.json

          out/failed-normal-Windows/${{ matrix.configuration }}/diagnostic-raw-index.json

          out/failed-normal-Windows/${{ matrix.configuration }}/*/*.csv

          out/failed-normal-Windows/${{ matrix.configuration }}/*/*.log

          out/failed-normal-Windows/${{ matrix.configuration }}/*/*.txt

          out/failed-normal-Windows/${{ matrix.configuration }}/*/invocation.json

          '
