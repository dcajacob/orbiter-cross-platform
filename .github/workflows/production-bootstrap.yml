name: Production Bootstrap

on:
  push:
    branches: ['codex/production-**']
    paths-ignore:
      - 'Docs/**'
      - 'README*'
      - 'Tests/Production/Verification/**'
      - 'Tests/Production/SpiceAudit/**'
      - 'Tests/Production/SpiceCoverage.cpp'
      - 'Tests/Production/audit_spice.py'
      - '.github/workflows/production-data.yml'
  pull_request:
    paths:
      - 'Tests/Production/**'
      - 'Docs/Production/**'
      - '.github/workflows/production-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Frozen production inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify stock corpus and frozen production source
        run: |
          python3 -B Tests/Production/inventory.py --verify
          python3 -B Tests/Production/frozen_reference.py

  windows-wgl:
    name: Windows WGL ${{ matrix.configuration }} x64
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - name: Configure and record toolchain
        shell: pwsh
        run: |
          cmake -S Tests/Production -B out/wgl -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "cl 2>&1 & exit /b 0" | Out-File out/wgl/compiler.txt
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber | Out-File out/wgl/windows.txt
          git rev-parse HEAD | Out-File out/wgl/source.txt
      - name: Build MSVC Windows window and WGL probe
        shell: pwsh
        run: |
          cmake --build out/wgl --parallel 2 2>&1 | Tee-Object out/wgl/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v6
        with:
          path: out/mesa-cache/*.pkg.tar.zst
          key: mesa-ucrt64-${{ hashFiles('Tests/Production/mesa-ucrt64.lock.json') }}
      - name: Stage verified application-local Mesa runtime and licenses
        run: python Tests/Production/mesa_runtime.py stage --cache out/mesa-cache --destination out/wgl
      - name: Execute real Windows WGL and audit loaded DLLs
        run: python Tests/Production/mesa_runtime.py probe --executable out/wgl/orbiter-wgl-probe.exe --output out/wgl-evidence
      - name: Preserve graphics bootstrap evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-wgl-${{ matrix.configuration }}-x64
          retention-days: 30
          path: |
            configure.log
            out/wgl/*.log
            out/wgl/*.txt
            out/wgl/*.json
            out/wgl/licenses/**
            out/wgl-evidence/**

  windows-production:
    name: Windows production reference ${{ matrix.configuration }} x64
    needs: [inventory, windows-wgl]
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DXSDK_DIR: '${{ github.workspace }}\DXSDK'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
          arch: x64
      - name: Cache DirectX SDK
        id: dxsdk
        uses: actions/cache@v6
        with:
          path: '${{ github.workspace }}\DXSDK'
          key: dxsdk_jun10
      - name: Download existing Windows build dependency
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl --fail -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o DXSDK_Jun10.exe
          if errorlevel 1 exit /b 1
          7z x DXSDK_Jun10.exe DXSDK/Include DXSDK/Lib
          if errorlevel 1 exit /b 1
          del DXSDK_Jun10.exe
      - name: Record compiler and build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/production-app | Out-Null
          cmd /c "cl 2>&1 & exit /b 0" | Set-Content out/production-app/compiler.txt
          Get-Item Env:CL,Env:_CL_,Env:VSCMD_VER,Env:VCToolsVersion -ErrorAction SilentlyContinue |
            Out-String | Set-Content out/production-app/build-metadata.txt
          exit 0
      - name: Configure Windows application
        shell: pwsh
        run: |
          cmake -S . -B out/production-app -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DORBITER_BUILD_D3D9CLIENT=ON -DORBITER_BUILD_XRSOUND=OFF `
            -DORBITER_MAKE_DOC=OFF -DORBITER_MAKE_TESTS=ON `
            -DORBITER_PORTABLE_REFERENCE_CAPTURE=ON -DORBITER_PRODUCTION_REFERENCE_CAPTURE=ON `
            "-DDXSDK_DIR:PATH=$env:DXSDK_DIR" 2>&1 | Tee-Object out/production-app/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application and existing tests
        shell: pwsh
        run: |
          cmake --build out/production-app --parallel 2 2>&1 | Tee-Object out/production-app/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing application tests
        shell: pwsh
        run: |
          ctest --test-dir out/production-app --output-on-failure 2>&1 | Tee-Object out/production-app/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify existing frozen two-body reference
        run: >-
          python Tests/Portable/verify_windows_application.py
          --source . --orbiter out/production-app/Orbiter.exe
          --output out/original-verification --configuration ${{ matrix.configuration }}
      - name: Record actual build tools, SDK, dependency commits and binaries
        run: python Tests/Production/build_metadata.py --build out/production-app
      - uses: actions/cache@v6
        with:
          path: out/data-cache/Orbiter-x64.zip
          key: production-data-${{ hashFiles('Tests/Production/stock-data.lock.json') }}
      - name: Prepare and verify pinned SPICE and stock data
        run: >-
          python Tests/Production/prepare_data.py --archive out/data-cache/Orbiter-x64.zip
          --destination out/production-data
      - name: Verify repeated production orbit and propulsion runs against frozen Windows evidence
        run: >-
          python Tests/Production/capture_reference.py
          --orbiter out/production-app/Orbiter.exe --data out/production-data
          --output out/production-reference --configuration ${{ matrix.configuration }}
          --reference Tests/Production/Reference
      - uses: actions/cache@v6
        with:
          path: out/planet-cache/Orbiter2016.zip
          key: production-standard-planets-${{ hashFiles('Tests/Production/standard-planets.lock.json') }}
      - name: Prepare digest-verified publisher standard planetary archives
        run: >-
          python Tests/Production/prepare_data.py --lock Tests/Production/standard-planets.lock.json
          --archive out/planet-cache/Orbiter2016.zip --destination out/standard-planets
      - name: Capture repeated production behavior before extraction
        run: >-
          python Tests/Production/behavior_suite.py --orbiter out/production-app/Orbiter.exe
          --data out/production-data --planets out/standard-planets --output out/production-behavior
          --configuration ${{ matrix.configuration }}
      - name: Package source-built application for isolated client and driver iteration
        if: always()
        shell: pwsh
        run: |
          if (Test-Path out/production-app/Orbiter.exe) {
            python Tests/Production/package_test_runtime.py --build out/production-app --output out/windows-test-runtime.zip
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-runtime-${{ matrix.configuration }}-x64
          retention-days: 30
          compression-level: 0
          path: out/windows-test-runtime.zip
      - name: Archive references and build metadata, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-reference-${{ matrix.configuration }}-x64
          retention-days: 30
          path: |
            out/production-behavior/**/*.csv
            out/production-behavior/**/*.json
            out/production-behavior/**/*.txt
            out/production-behavior/**/*.log
            out/production-behavior/**/*.scn
            out/production-behavior/**/Orbiter.cfg
            out/production-app/*.log
            out/production-app/*.txt
            out/production-app/build-inputs.json
            out/production-app/Testing/Temporary/*.log
            out/original-verification/**/trace.csv
            out/original-verification/**/*.json
            out/production-reference/**/*.csv
            out/production-reference/**/*.json
            out/production-reference/**/*.txt
            out/production-reference/**/*.log
            out/production-reference/**/*.scn
            out/production-reference/**/Orbiter.cfg

  compare-production:
    name: Production Debug/Release numerical and lifecycle comparison
    needs: windows-production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: production-reference-Debug-x64
          path: out/debug
      - uses: actions/download-artifact@v8
        with:
          name: production-reference-Release-x64
          path: out/release
      - name: Compare all objects and controlled quantities without changing budgets
        run: >-
          python3 -B Tests/Production/compare_references.py
          --reference out/debug/production-reference
          --candidate out/release/production-reference --report production-comparison.json
      - name: Compare behavioral production references in Debug and Release
        run: >-
          python3 -B Tests/Production/behavior_suite.py --compare out/debug/production-behavior
          --output out/release/production-behavior
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-reference-comparison
          retention-days: 30
          path: |
            production-comparison.json
            out/release/production-behavior/cross-configuration.json
