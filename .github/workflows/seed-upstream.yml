name: One-time upstream history import
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'dcajacob/orbiter-cross-platform'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create the original baseline branch once without overwriting refs
        run: |
          git fetch --no-tags https://github.com/orbitersim/orbiter.git main
          git cat-file -e 8e6ae437901417eef56f08b8f969ff92df83db5e^{commit}
          git branch upstream-baseline 8e6ae437901417eef56f08b8f969ff92df83db5e
          git push origin upstream-baseline
