name: Phase6 Independently Reproduce Frozen Core Cockpit Component
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-frozen-core-cockpit-independent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile:
        - Debug-automatic
        - Debug-sse2
        - Release-automatic
        - Release-sse2
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Bind only the actual successful repaired four-profile component and original raw bytes
      uses: actions/github-script@v8
      with:
        script: "const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo;\nconst run_id=42954705888,source='43cf2010c287ccf00b5700a231b71a40c4c8ff32',profile=process.env.PROFILE;\n\
          const profiles=['Debug-automatic','Debug-sse2','Release-automatic','Release-sse2'];\nif(owner!=='dcajacob'||repo!=='orbiter-cross-platform'||!profiles.includes(profile))throw\
          \ Error('Exact public repository/profile required');\nconst run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;\nconst jobs=await\
          \ github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id,per_page:100});\nconst wanted=['controls',...profiles.map(p=>'Frozen\
          \ core cockpit '+p)];\nif(run.head_sha!==source||run.run_attempt!==1||run.status!=='completed'||run.conclusion!=='success'||run.repository.private||\n\
          \   run.head_branch!=='qualification/frozen-core-cockpit-v2'||jobs.length!==5||jobs.some(j=>!wanted.includes(j.name)||j.head_sha!==source||j.status!=='completed'||j.conclusion!=='success'||j.labels.join(',')!=='ubuntu-24.04')||new\
          \ Set(jobs.map(j=>j.name)).size!==5)\n  throw Error('Every exact successful original runtime/profile/control job required');\nconst artifacts=(await\
          \ github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id,per_page:100})).data.artifacts;\nconst matches=artifacts.filter(a=>a.name==='frozen-core-cockpit-'+profile+'-raw'&&!a.expired&&a.workflow_run.id===run_id&&a.workflow_run.head_sha===source);\n\
          if(matches.length!==1)throw Error('One complete source-bound original raw archive required');\nconst artifact=matches[0],base='out/core-cockpit-independent/'+profile;fs.mkdirSync(base,{recursive:true});\n\
          const sourceRecord={run,jobs,artifact};fs.writeFileSync(base+'/api.json',JSON.stringify(sourceRecord,null,2),{flag:'wx'});\nconst downloaded=await\
          \ require('./.github/scripts/phase6-download-bound-artifact.cjs')({github,owner,repo,source:sourceRecord,artifact,base,core});\nconst bytes=Buffer.from(downloaded.data);\n\
          if(bytes.length!==artifact.size_in_bytes||'sha256:'+crypto.createHash('sha256').update(bytes).digest('hex')!==artifact.digest)throw Error('Original\
          \ exact raw API length/SHA differs');\nfs.writeFileSync(base+'/producer.zip',bytes,{flag:'wx'});\n"
    - name: Verify exact original frozen Windows reference release identities
      uses: actions/github-script@v8
      with:
        script: "const fs=require('fs'),{owner,repo}=context.repo;\nconst configs=[\n  ['production-windows-cockpit-v1','Cockpit'],\n  ['production-windows-cockpit-ui-v1','CockpitUI'],\n\
          \  ['production-windows-cockpit-ui-timing-v1','CockpitUITiming']];\nconst apis={};\nfor(const [tag,folder] of configs){\n  const ref=JSON.parse(fs.readFileSync('Tests/Production/'+folder+'/Reference/provenance.json','utf8'));\n\
          \  const release=(await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;\n  if(release.tag_name!==tag||release.draft||!Array.isArray(release.assets))throw\
          \ Error('Exact original '+folder+' frozen release required');\n  for(const pin of Object.values(ref.artifacts)){\n    if(release.assets.filter(x=>x.name===pin.name+'.zip'&&x.state==='uploaded'&&x.size===pin.size_bytes&&x.digest==='sha256:'+pin.sha256).length!==1)\n\
          \      throw Error('Actual frozen archive digest differs: '+folder+'/'+pin.name);\n  }\n  apis[folder]=release;\n}\nfs.mkdirSync('out',{recursive:true});\n\
          fs.writeFileSync('out/frozen-cockpit-original-release-api.json',JSON.stringify(apis,null,2),{flag:'wx'});\n\n"
    - name: Verify complete original raw closure and independently recompute every existing original comparison
      shell: bash
      run: 'set -euo pipefail

        python3 -B Tests/Production/Closeout/audit_frozen_cockpit_component.py --profile "$PROFILE"

        '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: independent-frozen-core-cockpit-${{ matrix.profile }}
        retention-days: 14
        if-no-files-found: error
        path: 'out/core-cockpit-independent/${{ matrix.profile }}/*.json

          '
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: independent-frozen-core-cockpit-${{ matrix.profile }}-partial
        retention-days: 14
        path: 'out/core-cockpit-independent/${{ matrix.profile }}/*.json

          out/core-cockpit-independent/${{ matrix.profile }}/*.log

          '
'on':
  push:
    branches:
    - qualification/frozen-core-cockpit-audit-v1
