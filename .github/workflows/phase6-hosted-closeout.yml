name: Phase 6 Hosted Closeout Builds

on:
  push:
    branches: ['qualification/hosted-closeout', 'qualification/windows-client-retry', 'qualification/native-package-retry']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase6-hosted-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    name: Verify every discovered closeout control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/phase6-hosted-controls.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase6-hosted-controls
          retention-days: 14
          path: out/phase6-hosted-controls.json

  windows-client:
    name: Retry current Windows application and all client checks
    if: github.ref != 'refs/heads/qualification/native-package-retry'
    needs: controls
    uses: ./.github/workflows/production-client.yml
    with:
      data_container_lock: Tests/Production/stock-data-container-v2.lock.json

  sanitizer-launcher-controls:
    name: Verify native sanitizer dispatch and Python launcher controls
    if: github.ref != 'refs/heads/qualification/windows-client-retry'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python3 -B Tests/Production/Closeout/sanitizer_launcher.py --output out/sanitizer-launcher-controls
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sanitizer-launcher-controls
          retention-days: 14
          path: out/sanitizer-launcher-controls/**

  native-package:
    name: Complete sanitized native package ${{ matrix.configuration }} ${{ matrix.math_profile }}
    if: github.ref != 'refs/heads/qualification/windows-client-retry'
    needs: [controls, sanitizer-launcher-controls]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        configuration: [Debug, Release]
        math_profile: [automatic, sse2]
    env:
      PACKAGE: out/phase6-hosted-native/${{ matrix.configuration }}-${{ matrix.math_profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build dependencies for both existing renderer backends and MPFR
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libgl1-mesa-dev
          libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libmpfr-dev
          libwayland-dev wayland-protocols libxkbcommon-dev
      - uses: actions/cache@v6
        with:
          path: out/ogl-dependencies
          key: native-production-ogl-${{ hashFiles('OVP/OGLClient/dependencies.lock.json', 'Src/ClientNative/CMakeLists.txt') }}
      - uses: actions/cache@v6
        with:
          path: out/phase6-hosted-build-dependencies
          key: phase6-full-native-inputs-${{ hashFiles('Tests/Production/dependencies.lock.json', 'Tests/Production/Atlantis/dependencies.lock.json', 'Src/Module/LuaScript/Native/CMakeLists.txt') }}
      - name: Verify every pinned renderer, Lua, ImPlot and upstream Catch input
        run: python3 -B Tests/Production/Closeout/hosted_native_package.py dependencies
      - name: Build all stock families, normal host and unchanged upstream unit bodies with sanitizers
        run: >-
          python3 -B Tests/Production/RemainingVessels/build_native.py
          --output "$PACKAGE" --renderer-dependencies out/ogl-dependencies
          --lua-archive out/phase6-hosted-build-dependencies/lua.zip
          --plot-archive out/phase6-hosted-build-dependencies/implot.zip
          --configuration ${{ matrix.configuration }} --math-profile ${{ matrix.math_profile }}
          --sanitizers --include-unit-tests --catch-source out/phase6-hosted-build-dependencies/Catch2 --jobs 2
      - name: Run every registered engine and upstream unit with ASan loaded before the Python math probe
        shell: bash
        run: |
          set -euo pipefail
          export LD_PRELOAD="$(c++ -print-file-name=libasan.so)"
          export PYTHONMALLOC=malloc
          failed=0
          ctest --test-dir "$PACKAGE/engine" --output-on-failure --output-junit "$PWD/$PACKAGE/engine-tests.xml" 2>&1 | tee "$PACKAGE/engine-tests.log" || failed=1
          ctest --test-dir "$PACKAGE/upstream-units" --output-on-failure --output-junit "$PWD/$PACKAGE/upstream-tests.xml" 2>&1 | tee "$PACKAGE/upstream-tests.log" || failed=1
          "$PACKAGE/upstream-units/existing_lua_unit" "$PACKAGE/upstream-units/assets" --list-tests > "$PACKAGE/upstream-lua-case-inventory.txt" || failed=1
          "$PACKAGE/upstream-units/existing_collision_unit" --list-tests > "$PACKAGE/upstream-collision-case-inventory.txt" || failed=1
          exit "$failed"
      - name: Seal exact runtime, generated sources and actual test results without acceptance credit
        if: ${{ always() && !cancelled() }}
        run: python3 -B Tests/Production/Closeout/hosted_native_package.py package --package "$PACKAGE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase6-full-native-${{ matrix.configuration }}-${{ matrix.math_profile }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            out/phase6-hosted-native/*.tar.gz
            out/phase6-hosted-native/${{ matrix.configuration }}-${{ matrix.math_profile }}/*.json
            out/phase6-hosted-native/${{ matrix.configuration }}-${{ matrix.math_profile }}/*.log
            out/phase6-hosted-native/${{ matrix.configuration }}-${{ matrix.math_profile }}/*.xml
            out/phase6-hosted-native/${{ matrix.configuration }}-${{ matrix.math_profile }}/*.txt
