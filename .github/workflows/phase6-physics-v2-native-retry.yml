name: Phase6 Physics v2 Identical Snapshot Transport Retry
'on':
  push:
    branches:
    - qualification/physics-v2-native-debug-v2
    - qualification/physics-v2-native-release-v2
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-physics-v2-native-retry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Fresh v2 all157normal stock ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: ${{ fromJSON(github.ref_name == 'qualification/physics-v2-native-debug-v2' && '["Debug-automatic","Debug-sse2"]' || '["Release-automatic","Release-sse2"]')
          }}
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Retain actual source-bound corrected build and every original failure
      uses: actions/github-script@v8
      with:
        script: await require('./Tests/Production/PhysicsV2/download.cjs')({github,context,core,role:'native',profile:process.env.PROFILE});
    - name: Restore every corrected application member and preserve31passes plus one original timeout
      run: python3 -B Tests/Production/PhysicsV2/restore.py native "$PROFILE"
    - name: Retry only the unchanged pure Python evidence verifier with its original60second deadline
      run: python3 -B Tests/Production/PhysicsV2/retry_evidence.py
    - name: Confirm exact original intentional exit release identities and native package inputs
      uses: actions/github-script@v8
      with:
        script: "const fs=require('fs'),{owner,repo}=context.repo;\nconst p=JSON.parse(fs.readFileSync('Tests/Production/NativeLua/StockExit/observations.lock.json','utf8')).durable_release;\n\
          const release=(await github.rest.repos.getReleaseByTag({owner,repo,tag:p.tag})).data;\nif(release.id!==p.id||release.tag_name!==p.tag||release.draft||release.assets.length!==p.assets.length||\n\
          \   p.assets.some(x=>release.assets.filter(a=>a.id===x.id&&a.name===x.name&&a.state==='uploaded'&&a.size===x.bytes&&a.digest==='sha256:'+x.sha256).length!==1))throw\
          \ Error('Exact immutable original exit release assets required');\nfs.writeFileSync('out/frozen-stock-exit-release-api.json',JSON.stringify(release,null,2),{flag:'wx'});\n\
          await require('./.github/scripts/phase6-download-native-api-inputs.cjs')({github,context,core});\n"
    - name: Restore every original GeneralAPI qualification byte with measured capacity and unchanged guard
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B Tests/Production/PhysicsV2/reference.py
    - name: Restore exact original runtime providers and immutable exit references
      shell: bash
      run: 'set -euo pipefail

        python3 -B Tests/Production/NativeLua/StockExit/frozen_original.py --cache out/frozen-stock-exit-cache --output out/frozen-stock-exit --audit out/frozen-stock-exit-preflight.json

        python3 -B Tests/Production/Closeout/restore_hosted_native_providers.py --api out/native-api-source/providers/api.json --archive out/native-api-source/providers/producer.zip
        --output out/native-provider-restoration/restoration.json

        python3 -B Tests/Production/Closeout/restore_hosted_mesa_topology.py --api out/native-api-source/mesa/api.json --archive out/native-api-source/mesa/producer.zip
        --output out/mesa-topology-restoration/restoration.json

        python3 -B Tests/Production/PhysicsV2/native_capture.py --prepare "$PROFILE"

        '
    - name: Run all157unchanged original stock scenes and original independent reader on fresh v2 application
      shell: bash
      run: 'set -euo pipefail

        source_dir="out/admission-package-source/$PROFILE"

        sha256sum --check "$source_dir/physics-v2-before.sha256"

        image=$(python3 -c "import json; print(''ubuntu@''+json.load(open(''Tests/Production/Closeout/native-provider-container.lock.json''))[''image_digest''])")

        docker pull "$image"

        docker image inspect "$image" > out/admission-container.json

        docker run --rm --init --cpus=2 --shm-size=1g -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /etc/ssl/certs/ca-certificates.crt:/run/orbiter-ci-system-ca.pem:ro
        -w "$GITHUB_WORKSPACE" -e GITHUB_ACTIONS -e RUNNER_OS -e GITHUB_WORKSPACE -e GITHUB_SHA -e GITHUB_RUN_ID -e PROFILE "$image" bash "$source_dir/physics-v2-network.sh"
        "$source_dir/physics-v2-bootstrap.sh" 2>&1 | tee out/admission-container.log

        sha256sum --check "$source_dir/physics-v2-before.sha256"

        '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: physics-v2-normal-${{ matrix.profile }}-raw
        retention-days: 14
        compression-level: 0
        include-hidden-files: true
        path: 'out/hosted-normal-admission/${{ matrix.profile }}/*.tar.gz

          out/hosted-normal-admission/${{ matrix.profile }}/*.json

          out/hosted-normal-admission/${{ matrix.profile }}/*.log

          out/hosted-normal-admission/${{ matrix.profile }}/*.txt

          out/physics-v2-input/native/${{ matrix.profile }}/api.json

          out/physics-v2-input/native/${{ matrix.profile }}/restoration.json

          out/physics-v2-unit-recheck/${{ matrix.profile }}/**

          out/admission-package-source/${{ matrix.profile }}/**

          out/admission-network/${{ matrix.profile }}/**

          out/original-package-official-pool/${{ matrix.profile }}/**

          out/admission-container.*

          out/native-api-source/*/*.json

          out/admission-reference-source/*.json

          out/frozen-stock-exit-preflight.json

          out/native-provider-restoration/*.json

          out/mesa-topology-restoration/*.json

          '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: physics-v2-normal-${{ matrix.profile }}-receipt
        retention-days: 14
        path: 'out/hosted-normal-admission/${{ matrix.profile }}/collection.json

          out/hosted-normal-admission/${{ matrix.profile }}/independent-full-stock-audit.json

          out/hosted-normal-admission/${{ matrix.profile }}/capture/stock-scenarios.json

          out/hosted-normal-admission/${{ matrix.profile }}/capture-raw-index.json

          out/physics-v2-unit-recheck/${{ matrix.profile }}/**

          out/physics-v2-input/native/${{ matrix.profile }}/restoration.json

          '
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: physics-v2-normal-${{ matrix.profile }}-partial
        retention-days: 14
        include-hidden-files: true
        path: 'out/hosted-normal-admission/${{ matrix.profile }}/capture/**

          out/hosted-normal-admission/${{ matrix.profile }}/compositor/**'
