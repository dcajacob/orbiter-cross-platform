name: Phase 6 Independently Audit Published Original Class Profiles

on:
  push:
    branches: ['qualification/native-class-independent-Release-automatic-v1']

permissions:
  contents: read
  actions: read

concurrency:
  group: phase6-original-class-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/class-lifetime-independent-controls.json
      - uses: actions/github-script@v8
        with:
          script: |
            core.info(JSON.stringify(await require('./.github/scripts/phase6-download-bound-artifact.Test.cjs')({core})));
            core.info(JSON.stringify(await require('./.github/scripts/phase6-download-native-api-inputs.Test.cjs')({core})));
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: independent-original-class-readiness
          retention-days: 14
          path: out/class-lifetime-independent-controls.json
  audit:
    name: Independently audit original class ${{ matrix.profile }}
    needs: readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [Release-automatic]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download only the already-passed exact native runtime and provider inputs
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/phase6-download-native-api-inputs.cjs')({github,context,core});
      - name: Restore the complete source-bound sanitized runtime and all original unit receipts
        run: >-
          python3 -B Tests/Production/Closeout/recheck_native_discovery.py
          --api out/native-api-source/native/api.json --archive out/native-api-source/native/producer.zip
          --profile "$PROFILE" --output "out/native-api-retained-units/$PROFILE"
      - name: Independently restore every base provider byte and original control
        run: >-
          python3 -B Tests/Production/Closeout/restore_hosted_native_providers.py
          --api out/native-api-source/providers/api.json --archive out/native-api-source/providers/producer.zip
          --output out/native-provider-restoration/restoration.json
      - name: Independently restore every separately compiled Mesa byte and negative control
        run: >-
          python3 -B Tests/Production/Closeout/restore_hosted_mesa_topology.py
          --api out/native-api-source/mesa/api.json --archive out/native-api-source/mesa/producer.zip
          --output out/mesa-topology-restoration/restoration.json
      - name: Download only the exact completed original class profile on GitHub
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/phase6-download-class-lifetimes.cjs')({github,context,core});
      - name: Re-read every world and reproduce both unchanged original class audits byte for byte
        run: >-
          python3 -B Tests/Production/Closeout/inspect_hosted_class_lifetimes.py
          --api "out/class-lifetime-published/$PROFILE/api.json" --archive "out/class-lifetime-published/$PROFILE/producer.zip"
          --profile "$PROFILE" --output "out/class-lifetime-independent/$PROFILE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: independent-original-class-${{ matrix.profile }}
          retention-days: 14
          compression-level: 3
          path: |
            out/class-lifetime-independent/${{ env.PROFILE }}/*.json
            out/class-lifetime-independent/${{ env.PROFILE }}/*.log
            out/class-lifetime-published/${{ env.PROFILE }}/*.json
            out/class-lifetime-published/${{ env.PROFILE }}/*.body
            out/native-api-source/*/*.json
            out/native-api-source/*/*.body
            out/native-api-retained-units/${{ env.PROFILE }}/*.json
            out/native-api-retained-units/${{ env.PROFILE }}/*.xml
            out/native-api-retained-units/${{ env.PROFILE }}/*.log
            out/native-provider-restoration/restoration.json
            out/mesa-topology-restoration/restoration.json
