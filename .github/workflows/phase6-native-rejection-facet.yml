name: Phase 6 Verify Four Independently Replayed Original Rejection Profiles
on:
  push:
    branches: ['qualification/native-rejection-facet-v1']
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-original-rejection-facet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify all180 original rejected normal-host processes and complete independent raw audit closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve all prior controls and source identity, process reuse, missing-control and changed-guard corruption checks
        run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/rejection-facet-controls.json
      - name: Download only exact complete independent metadata witnesses on this standard hosted worker
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/phase6-download-rejection-profile-proofs.cjs')({github,context,core});
      - name: Independently verify every original profile, process, file guard, compiler witness and unchanged original audit value
        run: >-
          python3 -B Tests/Production/Closeout/final_hosted_class_rejections.py
          --inputs out/rejection-profile-proofs
          --output out/class-rejection-facet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: complete-independent-original-rejection-facet-proof
          retention-days: 14
          compression-level: 3
          path: |
            out/rejection-facet-controls.json
            out/class-rejection-facet/*.json
            out/rejection-profile-proofs/*.json
            out/rejection-profile-proofs/*/api.json
            out/rejection-profile-proofs/*/download-transport-attempts.json
