name: Phase 6 Verify Published Full SDK Cohort Proofs
on:
  push:
    branches: ['qualification/native-full-sdk-published-v1']
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-published-full-SDK-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify full published SDK cohort ${{ matrix.math_profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        math_profile: [automatic, sse2]
    env:
      MATH_PROFILE: ${{ matrix.math_profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Preserve every original and new bounded source/publication control
        run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/published-SDK-controls.json
      - name: Retain the complete published SDK and historical source witnesses on GitHub only
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/phase6-download-published-full-SDK.cjs')({github,context,core});
      - name: Independently verify every published SDK variant and source witness and emit a small separate proof
        run: python3 -B Tests/Production/Closeout/verify_published_full_SDK.py --math-profile "$MATH_PROFILE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verified-published-full-SDK-${{ matrix.math_profile }}
          retention-days: 14
          compression-level: 3
          path: |
            out/full-SDK-published-verification/${{ env.MATH_PROFILE }}/*.json
            out/full-SDK-published/${{ env.MATH_PROFILE }}/*.json
            out/published-SDK-controls.json
