name: Native Production SPICE Modules
on:
  push:
    branches: ['codex/production-**']
    paths: ['Src/Celbody/**', 'Src/Orbiter/Production/**', 'Tests/Production/SpiceModules/**', '.github/workflows/production-spice-modules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native production SPICE ${{ matrix.os }} ${{ matrix.configuration }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          vsversion: '17.0'
          arch: x64
      - name: Install native Linux archive dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build actual production source modules and direct observer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Src/Orbiter/Production -B out/spice-native -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DORBITER_BUILD_NATIVE_CELESTIAL_MODULES=ON 2>&1 | tee spice-configure.log
          cmake --build out/spice-native --target production_native_spice_observer --parallel 2 2>&1 | tee spice-build.log
      - uses: actions/cache@v6
        with:
          path: out/data-cache/production-stock-data-v1.zip
          key: production-native-data-${{ hashFiles('Tests/Production/input-storage.lock.json') }}
      - name: Prepare exact production kernels and data
        run: >-
          python Tests/Production/prepare_native_data.py --archive out/data-cache/production-stock-data-v1.zip
          --destination out/data --group celestial
      - name: Compare real native modules with frozen original Windows
        run: >-
          python Tests/Production/SpiceModules/verify_port.py
          --executable out/spice-native/production_native_spice_observer${{ runner.os == 'Windows' && '.exe' || '' }}
          --modules out/spice-native/NativeModules --data out/data
          --output out/spice-observation --configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-spice-${{ matrix.os }}-${{ matrix.configuration }}-x64
          retention-days: 90
          path: |
            spice-*.log
            out/spice-native/CMakeCache.txt
            out/spice-observation/*.csv
            out/spice-observation/*.json
            out/spice-observation/*.log
  compare:
    name: Native SPICE Windows/Linux parity
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-spice-*-*-x64
          path: out/evidence
      - run: python3 -B Tests/Production/SpiceModules/compare_platforms.py --evidence out/evidence --report native-spice-parity.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-spice-parity
          retention-days: 90
          path: native-spice-parity.json
