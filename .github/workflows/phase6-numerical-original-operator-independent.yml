name: Phase 6 Independently Verify All Original Observed Primitive Results
on:
  push:
    branches: ['qualification/numerical-original-operator-independent-v1']
permissions:
  contents: read
  actions: read
concurrency:
  group: phase6-numerical-original-operator-independent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independently-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve every original source and acceptance control
        run: mkdir -p out && python3 -B Tests/Production/Closeout/run_controls.py --output out/original-operator-independent-controls.json
      - name: Download only the exact completed original operator raw witness on GitHub
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),{owner,repo}=context.repo;
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:42917970279})).data;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:42917970279,per_page:100});
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:13810297717})).data;
            const base='out/original-operator-published-input';fs.mkdirSync(base,{recursive:true});
            fs.writeFileSync(base+'/api.json',JSON.stringify({repository:context.repo,run,jobs,artifact},null,2),{flag:'wx'});
            if(run.head_sha!=='6185094a02e0358dc93383b273a54b9508dbb448'||run.status!=='completed'||run.conclusion!=='success'||run.run_attempt!==1||jobs.length!==1||jobs[0].id!==130185201050||jobs[0].head_sha!==run.head_sha||jobs[0].status!=='completed'||jobs[0].conclusion!=='success'||JSON.stringify(jobs[0].labels)!==JSON.stringify(['ubuntu-24.04'])||artifact.size_in_bytes!==4372705||artifact.digest!=='sha256:7f6ca9f51bffe203857adb129e4d6f4a713d1cdb09c44a9f294ffe3fff5a6c32')throw Error('Exact complete original raw replay required');
            const bytes=Buffer.from((await require('./.github/scripts/phase6-download-bound-artifact.cjs')({github,owner,repo,source:{run,jobs},artifact,base,core})).data);
            if(bytes.length!==4372705||crypto.createHash('sha256').update(bytes).digest('hex')!==artifact.digest.slice(7))throw Error('Exact original raw ZIP differs');
            fs.writeFileSync(base+'/producer.zip',bytes,{flag:'wx'});
      - name: Independently verify every original raw source and both complete actual result streams without running a simulator or compiler
        run: >-
          python3 -B Tests/Production/Closeout/inspect_published_original_numerical_operators.py
          --api out/original-operator-published-input/api.json --archive out/original-operator-published-input/producer.zip
          --output out/original-operator-independent
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-observed-operators-independent-proof
          retention-days: 14
          compression-level: 3
          path: |
            out/original-operator-independent/*.json
            out/original-operator-published-input/*.json
            out/original-operator-published-input/*.body
            out/original-operator-independent-controls.json
