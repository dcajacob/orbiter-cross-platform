; DG/DG-S laptop profile. Bare mechanism keys retain their vessel functions.
; Hold Alt for manual RCS; add Shift for one-tenth thrust.
; F cycles RCS, Ctrl+F enables/disables it. Alt+F retains aerodynamic control.
; Bare Home and PageUp/PageDown retain camera reset and external distance.
; Hold Alt for main/hover thrust so camera keys cannot fire engines.
IncMainThrust = PGUP ALT
DecMainThrust = PGDOWN ALT
KillMainRetroThrust = BACK
IncHoverThrust = HOME ALT
DecHoverThrust = END ALT
RCSMode = F
RCSEnable = F CTRL
NMKillrot = K ALT
NMHoldAltitude = A ALT CTRL
RCSPitchUp = W ALT
LPRCSPitchUp = W ALT SHIFT
RCSPitchDown = S ALT
LPRCSPitchDown = S ALT SHIFT
RCSYawLeft = A ALT
LPRCSYawLeft = A ALT SHIFT
RCSYawRight = D ALT
LPRCSYawRight = D ALT SHIFT
RCSBankLeft = Z ALT
LPRCSBankLeft = Z ALT SHIFT
RCSBankRight = C ALT
LPRCSBankRight = C ALT SHIFT
RCSUp = W ALT
LPRCSUp = W ALT SHIFT
RCSDown = S ALT
LPRCSDown = S ALT SHIFT
RCSLeft = A ALT
LPRCSLeft = A ALT SHIFT
RCSRight = D ALT
LPRCSRight = D ALT SHIFT
RCSForward = C ALT
LPRCSForward = C ALT SHIFT
RCSBack = Z ALT
LPRCSBack = Z ALT SHIFT
